<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>우리동네 아포칼립스</title>
<meta name="description" content="실제 지도에서 우리 동네를 골라 3D로 재현하고, 선택지로 30일을 버티는 생존 게임">
<!--
  PROTOTYPE — 우리동네 아포칼립스 (Neighborhood Apocalypse)
  Throwaway HTML concept build. Speed over standards.
  Data: OpenStreetMap (Nominatim search, Overpass building footprints).
  If the map APIs are unreachable, a procedural neighborhood is generated.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0e1013; --panel:rgba(18,20,24,.88); --panel-solid:#16191e; --line:#2c3139;
  --text:#e9e4da; --muted:#9aa0a8; --accent:#e0583a; --accent2:#f0b44c; --good:#6fcf7f;
  --bad:#ef5a4a; --blue:#5aa9e6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0e1013; } }
:root[data-theme="dark"]{ --bg:#0e1013; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- minimal Leaflet CSS (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,
.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#20242a;outline:0;touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}
.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both;position:relative;z-index:800;pointer-events:auto}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-bar{border-radius:6px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;background:#1b1f25;color:#eee;text-decoration:none;font-size:18px;border-bottom:1px solid #333}
.leaflet-control-attribution{background:rgba(0,0,0,.6);color:#bbb;font-size:10px;padding:0 5px;margin:0!important}
.leaflet-control-attribution a{color:#ddd}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}

/* ---------- map screen ---------- */
#mapScreen{position:fixed;inset:0;display:flex;flex-direction:column}
#mapHeader{padding:14px 16px 10px;background:linear-gradient(180deg,#1a0f0c,#0e1013);border-bottom:1px solid var(--line)}
#mapHeader h1{margin:0;font-size:24px;letter-spacing:.02em}
#mapHeader h1 span{color:var(--accent)}
#mapHeader p{margin:4px 0 10px;color:var(--muted);font-size:13px}
#searchRow{display:flex;gap:8px;max-width:720px}
#searchRow input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#111418;color:var(--text);font:inherit}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#1d2128;white-space:nowrap}
.btn:hover{border-color:#4a515c}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
#results{max-width:720px;margin-top:6px;max-height:160px;overflow:auto}
#results div{padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:#cfd3d8}
#results div:hover{background:#1f242b}
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#mapFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
#mapFooter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel-solid);border-top:1px solid var(--line)}
#selInfo{flex:1;min-width:200px;font-size:13px;color:var(--muted)}
#selInfo b{color:var(--text)}
#radiusSel{padding:9px;border-radius:8px;background:#111418;color:var(--text);border:1px solid var(--line)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,11,13,.94);z-index:50;gap:14px;text-align:center;padding:20px}
.spinner{width:42px;height:42px;border:4px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- game ---------- */
#game{position:fixed;inset:0}
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
#hud{position:absolute;top:10px;left:10px;width:270px;padding:10px 12px;font-size:13px;z-index:5}
#dayLine{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#dayLine .d{font-size:22px;font-weight:800}
#dayLine .d small{font-size:13px;color:var(--muted);font-weight:500}
#dayLine .t{color:var(--accent2);font-weight:700}
.bar{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:6px;margin:3px 0}
.bar .track{height:8px;background:#2a2e35;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .4s}
.bar .v{text-align:right;color:var(--muted);font-size:12px}
#inv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
#inv div{background:#1b1f25;border-radius:6px;padding:4px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inv div b{color:var(--text)}
#status{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
#status .inf{color:var(--bad);font-weight:700}
#log{position:absolute;right:10px;top:10px;width:290px;max-height:38vh;overflow:auto;padding:8px 10px;font-size:12px;line-height:1.55;z-index:5}
#log p{margin:0 0 3px;color:#c9ccd1}
#log p.g{color:var(--good)}#log p.b{color:#ff8b7e}#log p.s{color:var(--accent2)}
#log .dh{color:var(--muted);border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
#tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:13px;z-index:4;max-width:min(520px,calc(100% - 600px));text-align:center}
#actions{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
#actions button{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#1d2128;font-size:13px;line-height:1.2;min-width:72px}
#actions button small{display:block;color:var(--muted);font-size:11px}
#actions button:disabled{opacity:.35;cursor:not-allowed}
#actions button.on{background:var(--blue);border-color:var(--blue);color:#fff}
#rvPad{position:absolute;right:14px;bottom:90px;display:grid;grid-template-columns:repeat(3,46px);gap:4px;z-index:5}
#rvPad button{height:46px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:18px;user-select:none;-webkit-user-select:none;touch-action:none}
#hover{position:absolute;pointer-events:none;padding:7px 10px;font-size:12px;z-index:6;line-height:1.5;white-space:nowrap}
#hover b{font-size:13px}
#credit{position:absolute;right:10px;bottom:4px;font-size:10px;color:rgba(255,255,255,.55);z-index:4;text-shadow:0 1px 2px #000;pointer-events:none;text-align:right;max-width:60%}
#minimapHint{position:absolute;left:10px;bottom:12px;font-size:11px;color:var(--muted);padding:6px 8px;z-index:4;max-width:230px}

/* ---------- modal card ---------- */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:20;padding:16px}
#modal.show{display:flex}
#card{width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;background:linear-gradient(180deg,#1b1e24,#14161a);border:1px solid #3a3f48;border-radius:14px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#cardTag{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:.05em}
#cardTitle{margin:2px 0 8px;font-size:20px}
#cardText{font-size:14px;line-height:1.7;color:#d6d2c9;white-space:pre-line}
#cardText .g{color:var(--good)}#cardText .b{color:#ff8b7e}#cardText .s{color:var(--accent2)}
#cardChoices{display:flex;flex-direction:column;gap:7px;margin-top:14px}
#cardChoices button{text-align:left;padding:10px 12px;border-radius:9px;border:1px solid #3a3f48;background:#20242b;font-size:14px}
#cardChoices button:hover:not(:disabled){border-color:var(--accent);background:#272b33}
#cardChoices button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#cardChoices button:disabled{opacity:.4;cursor:not-allowed}

@media (max-width:820px){
  #hud{width:auto;right:10px;padding:8px 10px}
  #inv{grid-template-columns:repeat(6,1fr)} #inv div{font-size:11px;padding:3px 4px}
  .bar{grid-template-columns:44px 1fr 26px;margin:2px 0}
  #log{top:auto;bottom:118px;right:10px;left:10px;width:auto;max-height:70px;opacity:.92}
  #tip{display:none} #minimapHint{display:none}
  #actions button{min-width:0;padding:7px 8px;font-size:12px}
  #rvPad{bottom:200px}
}
</style>
</head>
<body>

<!-- ===================== MAP SCREEN ===================== -->
<section id="mapScreen">
  <div id="mapHeader">
    <h1>우리동네 <span>아포칼립스</span></h1>
    <p>동네를 검색하고 지도에서 위치를 고르면, 실제 건물 데이터로 3D 동네가 만들어집니다. 30일을 버티세요.</p>
    <form id="searchRow" autocomplete="off">
      <input id="q" placeholder="동네, 주소, 장소 검색 (예: 성수동, 해운대역, 망원시장)">
      <button class="btn" type="submit">검색</button>
      <button class="btn" type="button" id="geoBtn" title="내 위치">📍</button>
    </form>
    <div id="results"></div>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="mapFallback" class="hidden">지도 라이브러리를 불러오지 못했습니다.<br>검색 결과를 눌러 위치를 고르거나, 가상 동네로 시작하세요.</div>
  </div>
  <div id="mapFooter">
    <div id="selInfo">지도를 클릭하거나 검색해서 시작 위치를 고르세요.</div>
    <select id="radiusSel" title="동네 반경">
      <option value="180">반경 180m (가벼움)</option>
      <option value="250" selected>반경 250m</option>
      <option value="350">반경 350m (무거움)</option>
    </select>
    <button class="btn" id="satBtn" type="button">🛰 위성</button>
    <button class="btn" id="fakeBtn">가상 동네로 시작</button>
    <button class="btn primary" id="startBtn" disabled>이 동네로 시작 ▶</button>
  </div>
</section>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loadMsg">동네를 불러오는 중…</div></div>

<!-- ===================== GAME ===================== -->
<section id="game" class="hidden">
  <div id="view"></div>
  <div id="hud" class="panel">
    <div id="dayLine"><div class="d" id="dayTxt">1일차 <small>/ 30</small></div><div class="t" id="timeTxt">오전</div></div>
    <div id="bars"></div>
    <div id="inv"></div>
    <div id="status"></div>
  </div>
  <div id="log" class="panel"></div>
  <div id="tip" class="panel">건물을 클릭해 탐색하세요</div>
  <div id="minimapHint" class="panel">드래그: 회전 · 우클릭/Shift 드래그: 이동 · 휠: 확대</div>
  <div id="actions" class="panel">
    <button data-a="rest">🛏 휴식<small>체력·정신 회복</small></button>
    <button data-a="fort">🧱 보강<small>자재 2</small></button>
    <button data-a="craft">🔨 무기 제작<small>자재 3</small></button>
    <button data-a="heal">💊 치료<small>의약품 1</small></button>
    <button data-a="end">🌙 하루 마치기<small>밤으로</small></button>
    <button data-a="rv" id="rvBtn">🚶 로드뷰<small>거리 시점</small></button>
    <button data-a="home">🏠 거점 보기<small>카메라</small></button>
  </div>
  <div id="rvPad" class="hidden">
    <span></span><button data-k="f">▲</button><span></span>
    <button data-k="l">◀</button><button data-k="b">▼</button><button data-k="r">▶</button>
  </div>
  <div id="hover" class="panel hidden"></div>
  <div id="credit"></div>
  <div id="modal"><div id="card">
    <div id="cardTag"></div><h2 id="cardTitle"></h2><div id="cardText"></div><div id="cardChoices"></div>
  </div></div>
</section>

<script>
'use strict';
/* =========================================================================
   Utilities
   ========================================================================= */
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;
const pickArr = a => a[Math.floor(Math.random() * a.length)];
function pickW(obj) {
  let t = 0; for (const k in obj) t += obj[k];
  let r = Math.random() * t;
  for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
  return Object.keys(obj)[0];
}
function hash01(s) {
  s = String(s); let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* =========================================================================
   Building types — gameplay data (loot weights, danger, stock)
   ========================================================================= */
const TYPES = {
  house:     { label: '주택',      color: 0xb8a286, loot: { food: 2, water: 2, med: 1, mat: 2, weapon: .3 }, danger: .25, stock: [2, 4] },
  apt:       { label: '아파트',    color: 0x97a0aa, loot: { food: 3, water: 3, med: 1, mat: 1, weapon: .3 }, danger: .45, stock: [4, 7] },
  shop:      { label: '상가',      color: 0xc59a6d, loot: { food: 2, water: 2, med: .5, mat: 2, weapon: .3 }, danger: .35, stock: [2, 5] },
  store:     { label: '편의점',    color: 0x4fb39a, loot: { food: 5, water: 5, med: .6 },                   danger: .4,  stock: [3, 5] },
  mart:      { label: '마트',      color: 0x4a93cf, loot: { food: 7, water: 6, med: 1, mat: 1, weapon: .2 }, danger: .6,  stock: [5, 8] },
  restaurant:{ label: '음식점',    color: 0xd98a4e, loot: { food: 5, water: 2, mat: .5, weapon: .2 },       danger: .35, stock: [2, 4] },
  pharmacy:  { label: '약국',      color: 0x74cc74, loot: { med: 6, water: 1, food: .5 },                   danger: .35, stock: [3, 4] },
  hospital:  { label: '병원',      color: 0xe6e6e6, loot: { med: 8, water: 2, food: 1 },                    danger: .75, stock: [5, 8] },
  police:    { label: '경찰서',    color: 0x3c5fd8, loot: { weapon: 2.5, med: 1, mat: 1, food: .5 },         danger: .6,  stock: [3, 4] },
  fire:      { label: '소방서',    color: 0xd23b30, loot: { weapon: 1.5, med: 2, mat: 2, water: 1 },         danger: .45, stock: [3, 4] },
  school:    { label: '학교',      color: 0xd1a46c, loot: { food: 3, water: 2, med: 1, mat: 2 },             danger: .55, stock: [4, 6] },
  hardware:  { label: '철물점',    color: 0x8a7f6e, loot: { mat: 6, weapon: 1 },                            danger: .3,  stock: [3, 5] },
  office:    { label: '사무실',    color: 0x7c8a96, loot: { water: 2, mat: 2, food: 1, med: .5 },            danger: .35, stock: [2, 4] },
  church:    { label: '교회',      color: 0xcfc2a8, loot: { food: 2, water: 2, med: 1 },                    danger: .3,  stock: [2, 4] },
  factory:   { label: '공장·창고', color: 0x6f6a62, loot: { mat: 5, weapon: .6, water: 1 },                 danger: .4,  stock: [3, 5] },
  fuel:      { label: '주유소',    color: 0xe0c040, loot: { food: 2, water: 2, mat: 2 },                    danger: .4,  stock: [2, 3] },
};
const WEAPONS = ['맨손', '쇠파이프', '야구방망이', '소방도끼', '엽총'];
const LBL = { hp: '체력', full: '포만감', hyd: '수분', mind: '정신력', food: '식량', water: '물', med: '의약품', mat: '자재', fort: '방어', comp: '동료', noise: '소음' };
const DEF_H = { house: [6, 10], apt: [28, 48], shop: [7, 14], store: [4, 7], mart: [8, 14], restaurant: [5, 9], pharmacy: [5, 9], hospital: [18, 35], police: [10, 16], fire: [9, 13], school: [12, 18], hardware: [4, 7], office: [14, 30], church: [10, 18], factory: [7, 11], fuel: [5, 6] };

function classify(id, t, poi, area, levels) {
  const a = t.amenity || (poi && poi.amenity), s = t.shop || (poi && poi.shop), b = t.building;
  if (['hospital', 'clinic', 'doctors'].includes(a) || b === 'hospital') return 'hospital';
  if (a === 'pharmacy' || s === 'chemist') return 'pharmacy';
  if (a === 'police' || b === 'police') return 'police';
  if (a === 'fire_station' || b === 'fire_station') return 'fire';
  if (['school', 'university', 'college', 'kindergarten'].includes(a) || ['school', 'university', 'kindergarten', 'college'].includes(b)) return 'school';
  if (['supermarket', 'department_store', 'mall'].includes(s) || b === 'supermarket') return 'mart';
  if (s === 'convenience') return 'store';
  if (['hardware', 'doityourself'].includes(s)) return 'hardware';
  if (['restaurant', 'cafe', 'fast_food', 'bar', 'pub', 'food_court'].includes(a)) return 'restaurant';
  if (a === 'fuel') return 'fuel';
  if (a === 'place_of_worship' || ['church', 'temple', 'chapel', 'cathedral'].includes(b)) return 'church';
  if (['industrial', 'warehouse', 'factory', 'garage', 'garages', 'storage_tank'].includes(b)) return 'factory';
  if (['office', 'government', 'public', 'civic'].includes(b) || a === 'townhall') return 'office';
  if (['retail', 'commercial', 'kiosk'].includes(b) || s) return 'shop';
  if (b === 'apartments') return 'apt';
  if (['house', 'detached', 'residential', 'semidetached_house', 'terrace', 'dormitory'].includes(b))
    return (levels >= 5 || area > 900) ? 'apt' : 'house';
  if (levels >= 8 || area > 1800) return 'apt';
  const r = hash01(id);
  if (r < .52) return 'house'; if (r < .72) return 'shop'; if (r < .8) return 'apt';
  if (r < .86) return 'restaurant'; if (r < .91) return 'store'; if (r < .96) return 'office';
  return 'factory';
}

/* =========================================================================
   MAP SCREEN (Leaflet + Nominatim)
   ========================================================================= */
let lmap = null, selCircle = null, selDot = null, sel = null;
const DEFAULT_CENTER = [37.5445, 127.0560]; // 성수동

function initMap() {
  if (typeof L === 'undefined') { $('#mapFallback').classList.remove('hidden'); return; }
  lmap = L.map('map', { zoomControl: true, attributionControl: true }).setView(DEFAULT_CENTER, 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
  }).addTo(lmap);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' });
  $('#satBtn').onclick = () => { if (lmap.hasLayer(sat)) { sat.remove(); $('#satBtn').textContent = '🛰 위성'; } else { sat.addTo(lmap); $('#satBtn').textContent = '🗺 지도'; } };
  lmap.on('click', e => pick(e.latlng.lat, e.latlng.lng, null));
  setTimeout(() => lmap.invalidateSize(), 100);
}
function radius() { return +$('#radiusSel').value; }
function pick(lat, lon, label) {
  sel = { lat, lon, label: label || `${lat.toFixed(4)}, ${lon.toFixed(4)}` };
  if (lmap) {
    if (selCircle) { selCircle.remove(); selDot.remove(); }
    selCircle = L.circle([lat, lon], { radius: radius(), color: '#e0583a', weight: 2, fillOpacity: .12 }).addTo(lmap);
    selDot = L.circleMarker([lat, lon], { radius: 6, color: '#fff', weight: 2, fillColor: '#e0583a', fillOpacity: 1 }).addTo(lmap);
  }
  $('#selInfo').innerHTML = `시작 위치: <b>${esc(shortLabel(sel.label))}</b> · 반경 ${radius()}m 안의 건물이 3D로 생성됩니다.`;
  $('#startBtn').disabled = false;
  if (!label) reverseGeocode(lat, lon);
}
function shortLabel(s) { return String(s).split(',').slice(0, 3).join(',').trim(); }
async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&accept-language=ko`);
    const j = await r.json();
    if (sel && sel.lat === lat && j && j.display_name) {
      const a = j.address || {};
      sel.label = [a.suburb || a.quarter || a.neighbourhood || a.village || a.town, a.city_district || a.borough, a.city || a.province].filter(Boolean).join(', ') || j.display_name;
      $('#selInfo').innerHTML = `시작 위치: <b>${esc(shortLabel(sel.label))}</b> · 반경 ${radius()}m 안의 건물이 3D로 생성됩니다.`;
    }
  } catch (e) { /* label stays as coordinates */ }
}
$('#radiusSel').onchange = () => { if (sel) pick(sel.lat, sel.lon, sel.label); };
$('#searchRow').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  const box = $('#results'); box.innerHTML = '<div>검색 중…</div>';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&q=${encodeURIComponent(q)}`);
    const list = await r.json();
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div>검색 결과가 없습니다. 지도에서 직접 클릭해 보세요.</div>'; return; }
    for (const it of list) {
      const d = document.createElement('div');
      d.textContent = '📍 ' + it.display_name;
      d.onclick = () => {
        const lat = +it.lat, lon = +it.lon;
        if (lmap) lmap.setView([lat, lon], 17);
        pick(lat, lon, it.display_name); box.innerHTML = '';
      };
      box.appendChild(d);
    }
  } catch (err) {
    box.innerHTML = '<div>검색 서버에 연결할 수 없습니다. 지도를 직접 클릭하거나 가상 동네로 시작하세요.</div>';
  }
};
$('#geoBtn').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const { latitude: la, longitude: lo } = p.coords;
    if (lmap) lmap.setView([la, lo], 17);
    pick(la, lo, null);
  }, () => alert('위치 권한을 얻지 못했습니다.'));
};
$('#startBtn').onclick = () => sel && loadNeighborhood(sel);
$('#fakeBtn').onclick = () => loadNeighborhood(null);

/* =========================================================================
   OSM data (Overpass) → world
   ========================================================================= */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function fetchOSM(lat, lon, r) {
  const a = `(around:${r},${lat},${lon})`;
  const q = `[out:json][timeout:40];(way["building"]${a};relation["building"]${a};way["highway"](around:${r + 60},${lat},${lon});node["amenity"]${a};node["shop"]${a};node["natural"="tree"]${a};way["leisure"~"^(park|garden|playground)$"]${a};way["landuse"~"^(grass|forest|recreation_ground|village_green|meadow)$"]${a};way["natural"~"^(wood|scrub)$"]${a};);out geom;`;
  let lastErr;
  for (const url of OVERPASS) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 35000);
    try {
      $('#loadMsg').textContent = `건물 데이터를 받는 중… (${new URL(url).host})`;
      const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl.signal });
      clearTimeout(to);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) { clearTimeout(to); lastErr = e; }

}

function polyArea(p) { let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]); return Math.abs(a / 2); }

    const xi = p[i][0], zi = p[i][1], xj = p[j][0], zj = p[j][1];
    if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) ins = !ins;
  }

}
const ROAD_W = { motorway: 18, trunk: 16, primary: 14, secondary: 11, tertiary: 9, unclassified: 7, residential: 6, living_street: 5, service: 4, pedestrian: 5, footway: 2, path: 1.6, steps: 2, cycleway: 2, track: 3 };

/** Convert Overpass JSON into a world description (local metres; x east, z south). */
function worldFromOSM(data, lat0, lon0, r) {
  const k = Math.cos(lat0 * Math.PI / 180);
  const P = (la, lo) => [(lo - lon0) * 111320 * k, -(la - lat0) * 110574];
  const buildings = [], roads = [], pois = [], trees = [], greens = [];
  const ring = geom => {
    const pts = geom.map(g => P(g.lat, g.lon));
    const f = pts[0], l = pts[pts.length - 1];
    if (pts.length > 1 && Math.abs(f[0] - l[0]) < .01 && Math.abs(f[1] - l[1]) < .01) pts.pop();
    return pts;
  };
  const addBuilding = (id, pts, t) => {
    if (pts.length < 3) return;
    const area = polyArea(pts); if (area < 12) return;
    buildings.push({ id, pts, tags: t, area, c: centroid(pts) });
  };
  for (const el of data.elements || []) {
    const t = el.tags || {};
    if (el.type === 'way' && t.building && el.geometry && el.geometry.length >= 4) {
      addBuilding('w' + el.id, ring(el.geometry), t);
    } else if (el.type === 'relation' && t.building && el.members) {
      // multipolygon buildings (common for apartment complexes): use the outer rings
      el.members.filter(m => m.role === 'outer' && m.geometry && m.geometry.length >= 4)
        .forEach((m, i) => addBuilding(`r${el.id}_${i}`, ring(m.geometry), t));
    } else if (el.type === 'way' && t.highway && el.geometry && ROAD_W[t.highway]) {
      roads.push({ pts: el.geometry.map(g => P(g.lat, g.lon)), w: +t.width || ROAD_W[t.highway], kind: t.highway });
    } else if (el.type === 'way' && el.geometry && el.geometry.length >= 4 && (t.leisure || t.landuse || t.natural)) {
      const pts = ring(el.geometry); if (pts.length >= 3) greens.push({ pts, kind: t.leisure || t.landuse || t.natural, area: polyArea(pts) });
    } else if (el.type === 'node' && t.natural === 'tree') {
      trees.push(P(el.lat, el.lon));
    } else if (el.type === 'node' && (t.amenity || t.shop)) {
      const [x, z] = P(el.lat, el.lon); pois.push({ x, z, tags: t });
    }
  }
  // attach POIs to the building that contains them (or the nearest within 20 m)
  for (const p of pois) {
    let best = null, bd = 20 * 20;
    for (const b of buildings) {
      const dx = b.c[0] - p.x, dz = b.c[1] - p.z, d = dx * dx + dz * dz;
      if (d > 120 * 120) continue;
      if (inPoly(p.x, p.z, b.pts)) { best = b; break; }
      if (d < bd) { bd = d; best = b; }
    }
    if (best && !best.poi) best.poi = p.tags;

}

/* =========================================================================
   Real-world imagery & terrain (no API key)
   - Satellite: Esri World Imagery tiles (fallback: OSM map tiles)
   - Elevation: AWS Terrain Tiles (terrarium encoding)
   ========================================================================= */
const lon2tx = (lon, z) => (lon + 180) / 360 * 2 ** z;
const lat2ty = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z; };
const tx2lon = (x, z) => x / 2 ** z * 360 - 180;
const ty2lat = (y, z) => { const n = Math.PI - 2 * Math.PI * y / 2 ** z; return 180 / Math.PI * Math.atan(Math.sinh(n)); };
const SAT_SOURCES = [
  { name: 'Esri World Imagery', url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`, credit: '위성사진 © Esri, Maxar, Earthstar Geographics' },
  { name: 'OpenStreetMap', url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`, credit: '지도 © OpenStreetMap' },

function loadImg(url, ms = 15000) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    const to = setTimeout(() => { im.src = ''; res(null); }, ms);
    im.onload = () => { clearTimeout(to); res(im); };
    im.onerror = () => { clearTimeout(to); res(null); };
    im.src = url;
  });
}
/** Stitch tiles covering [lat0±ext, lon0±ext] into one canvas. Returns {canvas, west, east, north, south, z} or null. */
async function stitchTiles(urlFn, lat0, lon0, ext, z, minOk = .7) {
  const k = Math.cos(lat0 * Math.PI / 180);
  const dLat = ext / 110574, dLon = ext / (111320 * k);
  const x0 = Math.floor(lon2tx(lon0 - dLon, z)), x1 = Math.floor(lon2tx(lon0 + dLon, z));

    jobs.push(loadImg(urlFn(z, x, y)).then(im => { if (im) g.drawImage(im, (x - x0) * 256, (y - y0) * 256); return !!im; }));

  try { g.getImageData(0, 0, 1, 1); } catch (e) { return null; } // tainted canvas → unusable as WebGL texture

}
async function fetchImagery(lat0, lon0, r) {
  const ext = r + 110;
  for (const src of SAT_SOURCES) {
    // highest zoom that keeps the stitched texture ≤ 8×8 tiles (2048 px)
    let z = 19;
    const k = Math.cos(lat0 * Math.PI / 180);
    while (z > 15 && (2 * ext) / (40075016 * k / 2 ** z) > 7) z--;
    const t = await stitchTiles(src.url, lat0, lon0, ext, z);
    if (t) { t.credit = src.credit; t.source = src.name; return t; }
  }

}
async function fetchTerrain(lat0, lon0, r) {
  const z = 15, ext = r + 160;
  const t = await stitchTiles((z, x, y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`, lat0, lon0, ext, z, 1);
  if (!t) return null;
  const data = t.canvas.getContext('2d').getImageData(0, 0, t.canvas.width, t.canvas.height).data;
  const W = t.canvas.width, H = t.canvas.height;

/** Ground height (metres, relative to the start point) at local x,z. */
function getH(x, z) {
  if (!TER) return 0;
  const { N, half, grid } = TER;
  const fx = clamp((x + half) / (2 * half) * N, 0, N - 1e-6), fz = clamp((z + half) / (2 * half) * N, 0, N - 1e-6);

/** Procedural fallback neighborhood (no network). */
function worldProcedural(r) {
  const buildings = [], roads = [];
  const step = 78, n = Math.ceil(r / step) + 1;
  for (let i = -n; i <= n; i++) {
    const w = i % 3 === 0 ? 12 : 6, kind = i % 3 === 0 ? 'secondary' : 'residential';
    roads.push({ pts: [[i * step, -n * step], [i * step, n * step]], w, kind });
    roads.push({ pts: [[-n * step, i * step], [n * step, i * step]], w, kind });
  }
  const specials = ['hospital', 'police', 'mart', 'school', 'pharmacy', 'store', 'store', 'hardware', 'fire', 'church', 'fuel', 'pharmacy'];
  let id = 0;
  for (let gx = -n; gx < n; gx++) for (let gz = -n; gz < n; gz++) {
    const x0 = gx * step + 8, z0 = gz * step + 8, size = step - 16;
    const cx = x0 + size / 2, cz = z0 + size / 2;
    if (Math.hypot(cx, cz) > r + 30) continue;
    if (chance(.12)) continue; // empty lot / park
    const big = chance(.25);
    const cells = big ? 1 : 2;
    const cs = size / cells;
    for (let a = 0; a < cells; a++) for (let b = 0; b < cells; b++) {
      if (!big && chance(.15)) continue;
      const m = R(2, 5), x1 = x0 + a * cs + m, z1 = z0 + b * cs + m, w = cs - m * 2 - R(0, 6), d = cs - m * 2 - R(0, 6);
      const pts = [[x1, z1], [x1 + w, z1], [x1 + w, z1 + d], [x1, z1 + d]];
      let tags = { building: big ? (chance(.6) ? 'apartments' : 'yes') : 'yes' };
      const bid = 'p' + (id++);
      buildings.push({ id: bid, pts, tags, area: w * d, c: centroid(pts) });
    }
  }
  buildings.sort((a, b) => (a.c[0] ** 2 + a.c[1] ** 2) - (b.c[0] ** 2 + b.c[1] ** 2));
  // sprinkle special buildings so every town has the key places
  const pool = buildings.slice(4);
  specials.forEach((s, i) => { const b = pool[Math.floor((i + .5) / specials.length * pool.length)]; if (b) b.forceType = s; });
  return { buildings, roads, radius: r };
}

/** Finalise building gameplay properties from a world description. */
function prepareBuildings(world) {
  const counters = {};
  for (const b of world.buildings) {
    const t = b.tags, poi = b.poi;
    const levels = parseFloat(t['building:levels']) || 0;
    b.type = b.forceType || classify(b.id, t, poi, b.area, levels);
    const T = TYPES[b.type];
    let h = parseFloat(t.height) || (levels ? levels * 3.1 + 1 : 0);
    if (!h) { const [lo, hi] = DEF_H[b.type]; h = lo + hash01(b.id + 'h') * (hi - lo); if (b.area < 60) h = Math.min(h, 7); }
    b.h = clamp(h, 3, 160);
    const [s0, s1] = T.stock;
    b.stock0 = b.stock = s0 + Math.floor(hash01(b.id + 's') * (s1 - s0 + 1)) + (b.area > 1500 ? 2 : 0);
    counters[b.type] = (counters[b.type] || 0) + 1;
    b.name = t.name || (poi && poi.name) || `${T.label} ${counters[b.type]}`;
    if (t['name:ko']) b.name = t['name:ko'];
    b.visited = false;
    let mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
    for (const [x, z] of b.pts) { mnx = Math.min(mnx, x); mxx = Math.max(mxx, x); mnz = Math.min(mnz, z); mxz = Math.max(mxz, z); }
    b.bb = [mnx, mxx, mnz, mxz];

}

let lastWorldSrc = null; // {data, lat, lon, r} or {proc:true, r}

async function loadNeighborhood(s) {
  $('#loading').classList.remove('hidden');
  $('#loadMsg').textContent = '동네를 불러오는 중…';
  const r = radius();
  let world = null, note = '';
  if (s) {
    $('#loadMsg').textContent = '건물 · 위성사진 · 지형 데이터를 받는 중…';
    const [osm, sat, ter] = await Promise.allSettled([
      fetchOSM(s.lat, s.lon, r), fetchImagery(s.lat, s.lon, r), fetchTerrain(s.lat, s.lon, r)]);
    const satV = sat.status === 'fulfilled' ? sat.value : null;
    const terV = ter.status === 'fulfilled' ? ter.value : null;
    if (osm.status === 'fulfilled') {
      world = worldFromOSM(osm.value, s.lat, s.lon, r);
      lastWorldSrc = { data: osm.value, lat: s.lat, lon: s.lon, r, label: s.label, sat: satV, ter: terV };
      if (world.buildings.length < 8) { note = '이 위치에는 지도에 등록된 건물이 거의 없어 가상 건물로 채웠습니다.'; world = null; }
    } else note = '지도 건물 서버에 연결하지 못해 가상 동네를 생성했습니다.';
    if (world) {
      world.sat = satV; world.ter = terV; world.lat0 = s.lat; world.lon0 = s.lon;
      if (!satV) note = '위성사진을 불러오지 못해 기본 바닥으로 표시합니다.';
    }
  }
  if (!world) { world = worldProcedural(r); lastWorldSrc = { proc: true, r, label: s ? s.label : '가상 동네' }; }
  world.label = shortLabel(s ? s.label : '이름 없는 동네').split(',')[0];
  prepareBuildings(world);
  $('#mapScreen').classList.add('hidden');
  $('#game').classList.remove('hidden');
  $('#loadMsg').textContent = '3D 동네를 짓는 중…';
  await new Promise(res => setTimeout(res, 30));
  build3D(world);
  $('#loading').classList.add('hidden');
  newGame(world, note);
}

function rebuildSameWorld() {
  const src = lastWorldSrc; let world;
  if (src && !src.proc) {
    world = worldFromOSM(src.data, src.lat, src.lon, src.r);
    world.sat = src.sat; world.ter = src.ter; world.lat0 = src.lat; world.lon0 = src.lon;

  pole.position.y = 5; baseMarker.add(pole);

}

function spawnZombies(n) {
  n = Math.min(n, 220);
  while (zombies.length < n) {
    const p = roadSamples.length ? pickArr(roadSamples) : [R(-WORLD.radius, WORLD.radius), R(-WORLD.radius, WORLD.radius)];
    zombies.push({ x: p[0] + R(-2, 2), z: p[1] + R(-2, 2), tx: p[0], tz: p[1], sp: R(.6, 1.3), ph: R(0, 6), wait: 0 });

/* ---- controls: orbit + roadview (first person) ---- */
let pDown = null, pointers = new Map(), pinch0 = 0, hoverB = null, lastMove = 0;
function setupControls() {
  const el = renderer.domElement;
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pDown = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, btn: e.button, shift: e.shiftKey, moved: 0 };
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  el.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pDown) {
      const dx = e.clientX - pDown.lx, dy = e.clientY - pDown.ly;
      pDown.lx = e.clientX; pDown.ly = e.clientY; pDown.moved += Math.abs(dx) + Math.abs(dy);
      if (pointers.size === 2 && !rv.on) {
        const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch0) orbit.dist = clamp(orbit.dist * pinch0 / d, 25, 900); pinch0 = d; return;
      }
      if (rv.on) { rv.yaw -= dx * .004; rv.pitch = clamp(rv.pitch - dy * .004, -1.2, 1.2); }
      else if (pDown.btn === 2 || pDown.shift) {
        const s = orbit.dist * .0016;
        const fx = Math.sin(orbit.theta), fz = Math.cos(orbit.theta);
        orbit.goal.x += (-dx * fz - dy * fx) * s; orbit.goal.z += (dx * fx - dy * fz) * s;
        orbit.target.copy(orbit.goal);
      } else { orbit.theta -= dx * .006; orbit.phi = clamp(orbit.phi - dy * .005, .15, 1.45); }
      hideHover();
    } else {
      const now = performance.now(); if (now - lastMove > 50) { lastMove = now; hoverAt(e.clientX, e.clientY); }
    }
  });
  const up = e => {
    pointers.delete(e.pointerId);
    if (pDown && pDown.moved < 6 && e.button === 0 && pointers.size === 0) clickAt(e.clientX, e.clientY);
    if (pointers.size === 0) pDown = null; pinch0 = 0;
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', hideHover);
  el.addEventListener('wheel', e => { e.preventDefault(); if (!rv.on) orbit.dist = clamp(orbit.dist * (1 + Math.sign(e.deltaY) * .1), 25, 900); }, { passive: false });
  addEventListener('keydown', e => { rv.keys[e.key.toLowerCase()] = true; });
  addEventListener('keyup', e => { rv.keys[e.key.toLowerCase()] = false; });
  document.querySelectorAll('#rvPad button').forEach(b => {
    const k = { f: 'w', b: 's', l: 'a', r: 'd' }[b.dataset.k];
    b.addEventListener('pointerdown', e => { e.preventDefault(); rv.keys[k] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { rv.keys[k] = false; }));
  });
}
function pickBuilding(cx, cy) {

  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(bMeshes, false)[0];
  return hit ? hit.object.userData.b : null;
}
const outlineMat = new THREE.LineBasicMaterial({ color: 0xffa040 });
function setHighlight(b, on) {

  if (on && !b.outline) { b.outline = new THREE.LineSegments(new THREE.EdgesGeometry(b.mesh.geometry, 25), outlineMat); b.mesh.add(b.outline); }
  else if (!on && b.outline) { b.mesh.remove(b.outline); b.outline.geometry.dispose(); b.outline = null; }
}
function hoverAt(cx, cy) {
  if ($('#modal').classList.contains('show')) return hideHover();
  const b = pickBuilding(cx, cy);
  if (b !== hoverB) { setHighlight(hoverB, false); hoverB = b; setHighlight(b, true); }
  if (!b) return hideHover();
  const h = $('#hover'); h.classList.remove('hidden');
  const T = TYPES[b.type];

}

  $('#minimapHint').textContent = on ? '로드뷰: 드래그로 둘러보기 · WASD/방향키로 이동 · 건물 클릭으로 탐색' : '드래그: 회전 · 우클릭/Shift 드래그: 이동 · 휠: 확대';

let lastT = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (!WORLD) return;
  if (rv.on) {
    const k = rv.keys, sp = (k.shift ? 14 : 6) * dt;
    let mx = 0, mz = 0;
    if (k.w || k.arrowup) mz -= 1; if (k.s || k.arrowdown) mz += 1;
    if (k.a || k.arrowleft) mx -= 1; if (k.d || k.arrowright) mx += 1;
    if (mx || mz) {
      const sy = Math.sin(rv.yaw), cy = Math.cos(rv.yaw);
      const nx = rv.x + (mx * cy + mz * sy) * sp, nz = rv.z + (-mx * sy + mz * cy) * sp;
      if (!blocked(nx, rv.z)) rv.x = nx; if (!blocked(rv.x, nz)) rv.z = nz;

  });
}

function setTip(t) { $('#tip').innerHTML = t; }
function distB(b) { return S.base ? Math.hypot(b.c[0] - S.base.c[0], b.c[1] - S.base.c[1]) : Math.hypot(b.c[0], b.c[1]); }
function stockWord(b) { const r = b.stock / b.stock0; return b.stock <= 0 ? '텅 빔' : r > .66 ? (b.visited ? '많음' : '알 수 없음') : r > .33 ? '보통' : '조금'; }
function effDanger(b) { return TYPES[b.type].danger * (.75 + S.day / 24) * (1 + Math.max(0, distB(b) - 120) / 260); }
function dangerWord(b) { const d = effDanger(b); return d < .35 ? '낮음' : d < .6 ? '보통' : d < .85 ? '높음' : '매우 높음'; }

function log(msg, cls) {
  const p = document.createElement('p'); p.textContent = msg; if (cls) p.className = cls;
  const L = $('#log'); L.appendChild(p); L.scrollTop = L.scrollHeight;
  while (L.children.length > 120) L.removeChild(L.firstChild);

/** Apply a change set and return a readable summary. */
function gain(d) {
  const parts = [];
  for (const k in d) {
    const v = d[k]; if (!v) continue;
    if (['hp', 'full', 'hyd', 'mind'].includes(k)) S[k] = clamp(S[k] + v);
    else if (k === 'fort') S.fort = clamp(S.fort + v, 0, 12);
    else S[k] = Math.max(0, S[k] + v);
    parts.push(`<span class="${v > 0 ? 'g' : 'b'}">${LBL[k] || k} ${v > 0 ? '+' : ''}${v}</span>`);
  }
  updateHUD();
  return parts.join(' · ');
}
function plain(html) { return html.replace(/<[^>]+>/g, ''); }

function updateHUD() {

  const bar = (k, c) => `<div class="bar"><span>${LBL[k]}</span><div class="track"><div class="fill" style="width:${S[k]}%;background:${S[k] < 25 ? 'var(--bad)' : c}"></div></div><span class="v">${Math.round(S[k])}</span></div>`;
  $('#bars').innerHTML = bar('hp', '#e05a4a') + bar('full', '#e0a04a') + bar('hyd', '#5aa9e6') + bar('mind', '#b38ce0');
  $('#inv').innerHTML = `<div>🥫 식량 <b>${S.food}</b></div><div>💧 물 <b>${S.water}</b></div><div>💊 약 <b>${S.med}</b></div><div>🪵 자재 <b>${S.mat}</b></div><div>🛡 방어 <b>${S.fort}</b></div><div>👥 동료 <b>${S.comp}</b></div>`;
  $('#status').innerHTML = `무기: <b>${WEAPONS[S.weapon]}</b>${S.dog ? ' · 🐕 개' : ''}${S.generator ? ' · ⚡ 발전기' : ''}${S.infected ? ' · <span class="inf">감염됨!</span>' : ''}<br>거점: ${S.base ? esc(S.base.name) : '미정'}`;
  const canAct = S.phase === 'day' && S.ap > 0;
  document.querySelectorAll('#actions button').forEach(b => {
    const a = b.dataset.a;
    if (a === 'rv' || a === 'home') { b.disabled = !S.base && a === 'home'; return; }
    let ok = canAct;
    if (a === 'fort') ok = ok && S.mat >= 2 && S.fort < 12;
    if (a === 'craft') ok = ok && S.mat >= 3 && S.weapon < 2;
    if (a === 'heal') ok = ok && S.med >= 1;
    b.disabled = !ok;
  });
}

/* ---- card UI ---- */
function card(o) {
  $('#cardTag').textContent = o.tag || '';
  $('#cardTitle').textContent = o.title || '';
  $('#cardText').innerHTML = o.text || '';
  const box = $('#cardChoices'); box.innerHTML = '';
  for (const c of o.choices) {
    const b = document.createElement('button');
    b.innerHTML = esc(c.t) + (c.sub ? `<small>${c.sub}</small>` : '');
    b.disabled = !!c.dis;
    b.onclick = () => { closeCard(); c.fn && c.fn(); };
    box.appendChild(b);
  }
  $('#modal').classList.add('show'); hideHover();
}
function closeCard() { $('#modal').classList.remove('show'); }
function result(title, text, next, tag) { card({ tag: tag || '결과', title, text, choices: [{ t: '확인', fn: next || afterAction }] }); }

/* ---- turn flow ---- */
function spendAction() {
  S.ap--;
  S.full = clamp(S.full - 7); S.hyd = clamp(S.hyd - 9);
  let dmg = 0; if (S.full <= 0) dmg += 8; if (S.hyd <= 0) dmg += 10; if (S.mind <= 0) dmg += 5;
  if (dmg) { S.hp = clamp(S.hp - dmg); log(`굶주림·탈수·공포로 체력 -${dmg}`, 'b'); }
  setPhase(S.ap === 2 ? 'noon' : S.ap === 1 ? 'evening' : 'evening');
  updateHUD();
}
function afterAction() {
  if (S.hp <= 0) return gameOver();
  if (S.phase === 'day' && S.ap <= 0) return night();
  updateHUD();
  if (S.phase === 'day') setTip(`${TIME_LABEL[S.ap]} — 남은 행동 ${S.ap}회 · 건물을 클릭해 탐색하거나 거점에서 행동하세요`);
}

function onBuildingClick(b) {
  if (!S) return;
  if (S.phase === 'chooseBase') return chooseBaseCard(b);
  if (S.phase !== 'day') return;
  if (b === S.base) return baseCard();
  exploreCard(b);
}

function chooseBaseCard(b) {
  const T = TYPES[b.type];
  const goodBase = { house: 2, apt: 2, school: 1, church: 2, police: 3, fire: 2, office: 1, factory: 1 }[b.type] || 0;
  card({
    tag: '거점 선택', title: b.name,
    text: `${T.label} · 높이 약 ${Math.round(b.h)}m\n${goodBase >= 2 ? '<span class="g">튼튼한 편이라 거점으로 좋다.</span>' : goodBase === 1 ? '나쁘지 않은 선택이다.' : '<span class="b">유리창이 많아 방어하기 어려울 것 같다.</span>'}\n\n시작 방어도: <b>${1 + goodBase}</b>`,
    choices: [
      { t: '여기를 거점으로 삼는다', fn: () => setBase(b, 1 + goodBase) },
      { t: '다른 건물을 고른다', fn: () => { } },
    ],
  });
}
function setBase(b, fort) {
  S.base = b; S.fort = fort; b.stock = Math.max(0, b.stock - 1); b.visited = true;
  baseMarker.position.set(b.c[0], b.top, b.c[1]); baseMarker.visible = true;
  b.mesh.material[1].color.lerp(new THREE.Color(0x7fe08a), .45);
  focusOn(b.c[0], b.c[1], 180);
  log(`거점: ${b.name}`, 'g');
  S.phase = 'day'; S.ap = ACTIONS_PER_DAY;
  setPhase('morning'); updateHUD();
  result('거점 확보', `${esc(b.name)}의 문을 걸어 잠갔다. 남아 있던 물건을 챙겨 두었다.\n\n하루에 <b>3번</b> 행동할 수 있다(오전·오후·저녁).\n• 건물을 클릭해 <b>탐색</b>\n• 아래 버튼으로 거점에서 <b>휴식·보강·제작·치료</b>\n• 밤에는 좀비가 거점으로 몰려온다. 방어를 갖춰라.`, afterAction, 'DAY 1');
}

function baseCard() {
  card({
    tag: '거점', title: S.base.name,
    text: `방어도 ${S.fort} · 동료 ${S.comp}명${S.dog ? ' · 개 1마리' : ''}\n무엇을 할까?`,
    choices: [
      { t: '🛏 휴식', sub: '체력 +18, 정신력 +12', dis: S.ap <= 0, fn: () => doAction('rest') },
      { t: '🧱 바리케이드 보강', sub: '자재 2 → 방어 +1', dis: S.mat < 2 || S.fort >= 12, fn: () => doAction('fort') },
      { t: '🔨 무기 제작', sub: S.weapon >= 2 ? '더 좋은 무기는 찾아야 한다' : `자재 3 → ${WEAPONS[S.weapon + 1]}`, dis: S.mat < 3 || S.weapon >= 2, fn: () => doAction('craft') },
      { t: '💊 치료', sub: '의약품 1 → 체력 +30, 감염 치료', dis: S.med < 1, fn: () => doAction('heal') },
      { t: '닫기', fn: () => { } },
    ],
  });
}

function doAction(a) {
  if (S.phase !== 'day') return;
  if (a === 'end') {
    return card({ tag: '확인', title: '하루를 마칠까?', text: `남은 행동 ${S.ap}회를 포기하고 밤을 맞는다.\n남은 행동 1회당 정신력 +4 (쉬면서 마음을 다잡는다).`, choices: [{ t: '밤을 맞는다', fn: () => { S.mind = clamp(S.mind + S.ap * 4); S.ap = 0; night(); } }, { t: '취소', fn: () => { } }] });
  }
  if (S.ap <= 0) return;
  let txt = '', title = '';
  if (a === 'rest') {
    spendAction(); title = '휴식';
    const bonus = S.generator ? 6 : 0;
    txt = '문을 걸어 잠그고 눈을 붙였다.\n' + gain({ hp: 18 + bonus, mind: 12 + bonus });
  } else if (a === 'fort') {
    if (S.mat < 2) return; spendAction(); title = '바리케이드 보강';
    S.noise += 1;
    txt = '가구와 판자로 창문과 문을 막았다. 망치 소리가 골목에 울렸다.\n' + gain({ mat: -2, fort: 1 });
  } else if (a === 'craft') {
    if (S.mat < 3 || S.weapon >= 2) return; spendAction(); title = '무기 제작';
    S.weapon++;
    txt = `쓸만한 무기를 만들었다: <span class="s">${WEAPONS[S.weapon]}</span>\n` + gain({ mat: -3 });
  } else if (a === 'heal') {
    if (S.med < 1) return; spendAction(); title = '치료';
    const inf = S.infected; S.infected = 0;
    txt = '상처를 소독하고 붕대를 감았다.' + (inf ? '\n<span class="g">감염 증세가 가라앉았다.</span>' : '') + '\n' + gain({ med: -1, hp: 30 });
  }
  log(`${title}: ${plain(txt.split('\n').pop())}`);
  result(title, txt);
}
document.querySelectorAll('#actions button').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.a;
  if (a === 'rv') return setRoadview(!rv.on);
  if (a === 'home') { if (rv.on) setRoadview(false); if (S && S.base) focusOn(S.base.c[0], S.base.c[1], 180); return; }
  doAction(a);
}));

/* ---- exploration ---- */
function exploreCard(b) {
  const T = TYPES[b.type], d = Math.round(distB(b));
  const far = d > 160;
  card({
    tag: `${T.label} · 거점에서 ${d}m`, title: b.name,
    text: `물자: <b>${stockWord(b)}</b> · 위험: <b>${dangerWord(b)}</b>${far ? '\n<span class="b">거리가 멀어 더 지치고 위험하다.</span>' : ''}${b.stock <= 0 ? '\n<span class="b">이미 샅샅이 뒤진 곳이다.</span>' : ''}\n\n남은 행동: ${S.ap}회`,
    choices: [
      { t: '🔦 꼼꼼히 수색한다', sub: '물자를 많이 찾지만, 오래 머물러 위험하다', dis: S.ap <= 0, fn: () => explore(b, 'careful') },
      { t: '🏃 빠르게 훑는다', sub: '조금만 챙기고 재빨리 빠진다', dis: S.ap <= 0, fn: () => explore(b, 'quick') },
      { t: '🚶 로드뷰로 가서 본다', sub: '거리 시점으로 건물 앞에 선다 (행동 소모 없음)', fn: () => walkTo(b) },
      { t: '돌아간다', fn: () => { } },
    ],
  });
}
function walkTo(b) {
  setRoadview(true);
  let best = null, bd = 1e9;
  for (const p of roadSamples) { const d = (p[0] - b.c[0]) ** 2 + (p[1] - b.c[1]) ** 2; if (d < bd && !blocked(p[0], p[1])) { bd = d; best = p; } }
  if (!best) best = [b.bb[1] + 4, b.c[1]];
  rv.x = best[0]; rv.z = best[1];
  rv.yaw = Math.atan2(-(b.c[0] - rv.x), -(b.c[1] - rv.z));
  rv.pitch = Math.min(.6, Math.atan2(b.top - b.h * .5 - getH(rv.x, rv.z), Math.sqrt(bd) || 10));
}

function explore(b, mode) {
  spendAction();
  if (!rv.on) focusOn(b.c[0], b.c[1], 120);
  b.visited = true;
  const careful = mode === 'careful';
  const far = Math.max(0, distB(b) - 160);
  if (far > 0) { S.full = clamp(S.full - 3); S.hyd = clamp(S.hyd - 4); }
  // encounter odds
  let p = effDanger(b) * (careful ? .62 : .36) - (S.dog ? .05 : 0);
  if (b.stock <= 0) p *= .6;
  p = clamp(p, .05, .85);
  const doLoot = (mult = 1, pre = '') => lootResult(b, careful, mult, pre);
  // special events inside buildings
  if (b.stock > 0 && chance(careful ? .22 : .12)) return buildingEvent(b, careful, doLoot);
  if (chance(p)) return encounter(b, careful, doLoot);
  doLoot();
}

function lootResult(b, careful, mult, pre) {
  const T = TYPES[b.type];
  let units = Math.min(b.stock, careful ? 2 : 1);
  b.stock -= units;
  const got = {};
  let draws = Math.round(units * (careful ? 2.2 : 1.8) * mult);
  if (units === 0) draws = chance(.25) ? 1 : 0;
  let weaponTxt = '';
  for (let i = 0; i < draws; i++) {
    const k = pickW(T.loot);
    if (k === 'weapon') {
      const cap = b.type === 'police' ? 4 : b.type === 'fire' ? 3 : 2;
      if (S.weapon < cap) { S.weapon = Math.min(cap, S.weapon + 1); weaponTxt = `\n🗡 새 무기를 찾았다: <span class="s">${WEAPONS[S.weapon]}</span>`; }
      else got.mat = (got.mat || 0) + 1;
    } else got[k] = (got[k] || 0) + 1 + (chance(.35) ? 1 : 0);
  }
  S.looted += draws;
  if (b.stock <= 0 && !b.dimmed) { b.dimmed = true; b.mesh.material[1].color.multiplyScalar(.5); if (b.sign) b.sign.material.opacity = .35; }
  const summary = gain(got);
  const flavor = draws === 0 ? '쓸만한 건 아무것도 없었다.' : pickArr(['먼지 쌓인 선반을 뒤졌다.', '부서진 문 너머를 살폈다.', '서랍과 찬장을 하나씩 열어 보았다.', '어둠 속에서 손전등을 비추며 물건을 챙겼다.']);
  log(`${b.name}: ${plain(summary) || '수확 없음'}${weaponTxt ? ' · ' + WEAPONS[S.weapon] : ''}`, draws ? 'g' : '');
  result(`${b.name} 수색`, `${pre}${flavor}\n${summary || '<span class="b">수확 없음</span>'}${weaponTxt}\n\n남은 물자: ${stockWord(b)}`);
}

function hordeSize() { return 1 + Math.floor(Math.random() * (1.5 + S.day / 7)); }
function fightOdds(n) { return clamp(.42 + S.weapon * .12 + Math.min(S.comp, 3) * .05 - n * .07 - (S.hp < 40 ? .08 : 0), .08, .95); }

function encounter(b, careful, doLoot) {
  const n = hordeSize();
  const odds = fightOdds(n);
  card({
    tag: '⚠ 조우', title: n === 1 ? '좀비 한 마리!' : `좀비 ${n}마리!`,
    text: `${esc(b.name)} 안쪽에서 ${n === 1 ? '그것이' : '그것들이'} 고개를 돌렸다. 썩은 냄새가 코를 찌른다.\n\n무기: ${WEAPONS[S.weapon]} · 이길 확률 약 <b>${Math.round(odds * 100)}%</b>`,
    choices: [
      { t: '⚔ 싸운다', sub: '이기면 수색을 계속한다', fn: () => fight(n, odds, b, doLoot) },
      { t: '🏃 도망친다', sub: '빈손으로 빠져나간다 (확률 70%)', fn: () => flee(n) },
      { t: '🫥 숨는다', sub: '지나가길 기다린다 · 정신력 소모 (확률 50%)', fn: () => hide(n, odds, b, doLoot) },
    ],
  });
}
function fight(n, odds, b, doLoot) {
  if (chance(odds)) {
    S.kills += n;
    const dmg = RI(0, 4 + n * 2);
    const bitten = chance(.05 * n);
    if (bitten) S.infected = Math.max(S.infected, 1);
    const t = gain({ hp: -dmg, mind: -3 });
    log(`좀비 ${n}마리 처치${bitten ? ' (물렸다!)' : ''}`, bitten ? 'b' : 'g');
    return doLoot(1, `<span class="g">${WEAPONS[S.weapon]}(으)로 ${n}마리를 쓰러뜨렸다.</span> ${t}${bitten ? '\n<span class="b">팔에 이빨 자국이 남았다… 감염됐다. 의약품이 필요하다.</span>' : ''}\n\n`);
  }
  const dmg = RI(12, 20) + n * 4;
  const bitten = chance(.25 + n * .05);
  if (bitten) S.infected = Math.max(S.infected, 1);
  const t = gain({ hp: -dmg, mind: -8 });
  log(`전투 패배: 체력 -${dmg}${bitten ? ', 감염' : ''}`, 'b');
  result('간신히 탈출', `몸싸움 끝에 겨우 밀쳐내고 도망쳤다.\n${t}${bitten ? '\n<span class="b">물렸다. 감염됐다! 의약품으로 치료하지 않으면 밤마다 체력을 잃는다.</span>' : ''}`);
}
function flee(n) {
  if (chance(.7)) { const t = gain({ mind: -4, hyd: -4 }); log('도망쳤다'); return result('도주 성공', `숨이 턱까지 차도록 달려 거점 방향으로 빠져나왔다.\n${t}`); }
  const t = gain({ hp: -RI(8, 15), mind: -6 });
  log('도주 중 부상', 'b');
  result('도주 중 부상', `넘어진 순간 손톱이 다리를 할퀴었다. 겨우 빠져나왔다.\n${t}`);
}
function hide(n, odds, b, doLoot) {
  if (chance(.5)) { const t = gain({ mind: -8 }); return doLoot(.6, `캐비닛 안에서 숨을 죽였다. 발소리가 멀어진다. ${t}\n\n`); }
  log('숨기 실패!', 'b');
  card({ tag: '⚠ 발각', title: '들켰다!', text: '문이 거칠게 열렸다. 싸울 수밖에 없다. (불리한 상황)', choices: [{ t: '⚔ 싸운다', fn: () => fight(n, odds * .8, b, doLoot) }] });
}

/* ---- special events inside buildings ---- */
function buildingEvent(b, careful, doLoot) {
  const pool = [];
  pool.push('survivor', 'locked', 'note');
  if (S.day >= 6) pool.push('raiders');
  if (b.type === 'hospital') pool.push('ward', 'ward');
  if (b.type === 'police') pool.push('armory', 'armory');
  if (b.type === 'school' || b.type === 'church') pool.push('survivor', 'shelter');
  if (b.type === 'mart' || b.type === 'store') pool.push('stockroom');
  if (b.type === 'factory' || b.type === 'hardware') pool.push('generator');
  const ev = pickArr(pool);
  const E = BEVENTS[ev];
  card(E(b, doLoot));
}
const BEVENTS = {
  survivor: (b, doLoot) => {
    const name = pickArr(['대학생 민지', '편의점 사장 박씨', '고등학생 준호', '간호사 서연', '택배기사 김씨', '은퇴한 군인 최씨', '이웃 할머니']);
    const sick = chance(.2);
    return {
      tag: '생존자', title: `${name}를 만났다`,
      text: `${esc(b.name)}에 숨어 있던 생존자다. 지치고 배고파 보인다.\n"제발… 같이 가게 해 주세요."\n\n동료는 밤 방어에 도움이 되지만 매일 식량과 물을 1씩 더 먹는다.`,
      choices: [
        { t: '👥 동료로 받아들인다', sub: '동료 +1', fn: () => { S.comp++; if (sick) S.flags.sickComp = S.day + 1; log(`${name} 합류`, 'g'); doLoot(1, `${name}가 합류했다. 함께 남은 물건을 챙겼다. ${gain({ mind: 10 })}\n\n`); } },
        { t: '🤝 물자만 나눈다', sub: '식량 1 → 의약품 1', dis: S.food < 1, fn: () => { const t = gain({ food: -1, med: 1, mind: 4 }); result('나눔', `${name}에게 식량을 건네자 비상약을 내밀었다.\n${t}`); } },
        { t: '🚪 그냥 떠난다', sub: '정신력 -6', fn: () => doLoot(.8, `뒤에서 흐느끼는 소리가 들렸다. ${gain({ mind: -6 })}\n\n`) },
      ],
    };
  },
  locked: (b, doLoot) => ({
    tag: '발견', title: '잠긴 창고 문',
    text: '안쪽에 무언가 쌓여 있는 게 문틈으로 보인다. 부수면 큰 소리가 날 것이다.',
    choices: [
      { t: '🔨 자재로 문을 부순다', sub: '자재 1 · 소음 +2 · 큰 수확', dis: S.mat < 1, fn: () => { S.noise += 2; gain({ mat: -1 }); doLoot(2, '<span class="s">쾅! 문이 열렸다.</span> 소리가 골목까지 울렸다. 오늘 밤이 걱정된다.\n\n'); } },
      { t: '🔧 조용히 자물쇠를 딴다', sub: '성공 40% · 실패해도 평소만큼은 챙김', fn: () => chance(.4) ? doLoot(1.8, '<span class="g">찰칵. 조용히 열렸다.</span>\n\n') : doLoot(1, '자물쇠는 끝내 열리지 않았다.\n\n') },
      { t: '무시하고 수색한다', fn: () => doLoot(1) },
    ],
  }),
  note: (b, doLoot) => {
    const notes = [

function beginDay() {
  S.phase = 'morning'; S.ap = ACTIONS_PER_DAY; S.noise = 0;
  setPhase('morning'); retargetAllZombies();
  spawnZombies(14 + S.day * 5);
  log(`— ${S.day}일차 아침 —`, 's');
  const p = $('#log').lastChild; if (p) p.classList.add('dh');
  // a companion found sick earlier turns
  if (S.flags.sickComp && S.day >= S.flags.sickComp && S.comp > 0) {
    delete S.flags.sickComp;
    return card({ tag: '비극', title: '변해 버린 동료', text: '새로 합류했던 동료가 밤사이 변해 버렸다. 숨겨 둔 상처가 있었던 것이다.', choices: [{ t: '…', fn: () => { const t = gain({ comp: -1, hp: -10, mind: -15 }); log(plain(t), 'b'); startMorningEvent(); } }] });
  }
  startMorningEvent();
}
function startMorningEvent() {
  updateHUD();
  if (STORY[S.day]) return card(STORY[S.day]());
  if (S.day === 1 || chance(.15)) return morningDone(null);
  let pool = MORNING.filter(e => !S.seen.has(e.id) && (!e.cond || e.cond()));
  if (!pool.length) { S.seen.clear(); pool = MORNING.filter(e => !e.cond || e.cond()); }
  const e = pickArr(pool); S.seen.add(e.id);
  card(e.fn());
}
function morningDone(txt) {
  S.phase = 'day';
  setPhase('morning');
  if (txt) { log(plain(txt).slice(0, 80)); return result('아침', txt, afterAction, `DAY ${S.day}`); }
  afterAction();
}

function night() {
  S.phase = 'night'; S.ap = 0;
  setPhase('night'); retargetAllZombies();
  if (rv.on) setRoadview(false);
  focusOn(S.base.c[0], S.base.c[1], 160);
  updateHUD();
  setTip('🌙 밤 — 좀비들이 거점으로 몰려온다');
  setTimeout(resolveNight, 1600);
}
function resolveNight() {
  const L = [];
  const n = 1 + S.comp;
  // dinner
  if (S.food >= n) { S.food -= n; S.full = clamp(S.full + 38); L.push(`🥫 저녁 식사 (식량 -${n})`); }
  else { const had = S.food; S.food = 0; S.full = clamp(S.full + (had ? 15 : 0)); S.mind = clamp(S.mind - 8); L.push(`<span class="b">🥫 식량 부족! (${had}/${n})</span>`);
    if (S.comp > 0 && chance(.35)) { S.comp--; L.push('<span class="b">굶주린 동료 한 명이 떠났다.</span>'); } }
  if (S.water >= n) { S.water -= n; S.hyd = clamp(S.hyd + 42); L.push(`💧 물 (물 -${n})`); }
  else { const had = S.water; S.water = 0; S.hyd = clamp(S.hyd + (had ? 18 : 0)); S.mind = clamp(S.mind - 8); L.push(`<span class="b">💧 물 부족! (${had}/${n})</span>`);
    if (S.comp > 0 && chance(.3)) { S.comp--; L.push('<span class="b">목마른 동료 한 명이 떠났다.</span>'); } }
  // infection
  if (S.infected) {
    if (S.med > 0) { S.med--; S.infected = 0; L.push('<span class="g">💊 의약품으로 감염을 치료했다.</span>'); }
    else { S.infected++; const d = 10 + S.infected * 5; S.hp = clamp(S.hp - d); L.push(`<span class="b">🦠 감염 악화: 체력 -${d}</span>`); }
  }
  // attack
  const finalNight = S.day >= MAX_DAY;
  const surge = S.day >= 20 ? 1.25 : 1;
  const strength = (4 + S.day * 1.45 + S.noise * 3 + S.raiderGrudge * 2) * surge * (finalNight ? 1.25 : 1);
  const defense = S.fort * 3 + S.weapon * 2.5 + Math.min(S.comp, 5) * 2.5 + (S.dog ? 3 : 0) + R(0, 9);
  const diff = strength - defense;
  if (S.raiderGrudge > 0 && chance(.5)) { S.raiderGrudge = Math.max(0, S.raiderGrudge - 1); }
  if (diff <= 0) {
    L.push(diff < -8 ? '🌙 좀비들이 문을 긁다 돌아갔다. 조용한 밤이었다.' : '🛡 바리케이드가 버텨 냈다. 몇 마리를 쓰러뜨렸다.');
    if (diff > -4 && chance(.4) && S.fort > 0) { S.fort--; L.push('<span class="b">바리케이드가 조금 망가졌다 (방어 -1)</span>'); }
    S.kills += RI(0, 3);
  } else {
    const dmg = Math.round(diff * 2 + R(0, 6));
    S.hp = clamp(S.hp - dmg); S.mind = clamp(S.mind - 8);
    L.push(`<span class="b">🧟 좀비가 바리케이드를 뚫었다! 체력 -${dmg}</span>`);
    if (S.fort > 0) { S.fort = Math.max(0, S.fort - (diff > 8 ? 2 : 1)); L.push('<span class="b">방어 감소</span>'); }
    if (S.comp > 0 && diff > 6 && chance(.45)) { S.comp--; L.push('<span class="b">동료 한 명을 잃었다…</span>'); }
    if (chance(.15)) { S.infected = Math.max(1, S.infected); L.push('<span class="b">싸우다 물렸다. 감염!</span>'); }
    if (S.food > 0 && chance(.4)) { const lost = Math.min(S.food, RI(1, 2)); S.food -= lost; L.push(`<span class="b">식량 ${lost}개가 짓밟혔다.</span>`); }
  }
  // mind
  const md = -5 + Math.min(S.comp, 3) * 2 + (S.dog ? 2 : 0) + (S.generator ? 3 : 0);
  S.mind = clamp(S.mind + md);
  if (S.full > 40 && S.hyd > 40) S.hp = clamp(S.hp + 5);
  updateHUD();
  L.forEach(x => log(plain(x), x.includes('class="b"') ? 'b' : x.includes('class="g"') ? 'g' : ''));
  if (S.hp <= 0) return card({ tag: `NIGHT ${S.day}`, title: `${S.day}일차 밤`, text: L.join('\n'), choices: [{ t: '…', fn: gameOver }] });
  card({
    tag: `NIGHT ${S.day}`, title: finalNight ? '최후의 밤' : `${S.day}일차 밤`,
    text: L.join('\n') + `\n\n<small style="color:#9aa0a8">공격 세기 ${Math.round(strength)} vs 방어력 ${Math.round(defense)}</small>`,
    choices: [{ t: finalNight ? '새벽을 맞는다' : '잠든다 →', fn: () => { if (finalNight) return victory(); S.day++; beginDay(); } }],
  });
}

function summary() { return `생존 일수: <b>${S.day}일</b>\n처치한 좀비: ${S.kills} · 모은 물자: ${S.looted}\n동료: ${S.comp}명${S.dog ? ' + 개' : ''} · 무기: ${WEAPONS[S.weapon]}`; }
function gameOver() {
  S.phase = 'over'; updateHUD(); setTip('☠ 게임 오버');
  card({ tag: 'GAME OVER', title: '우리 동네에서 끝나다', text: `${S.mind <= 0 ? '정신이 먼저 무너졌다.' : '더는 버틸 수 없었다.'}\n\n${summary()}`, choices: [
    { t: '🔁 같은 동네에서 다시', fn: rebuildSameWorld },
    { t: '🗺 다른 동네 고르기', fn: backToMap }] });
}
function victory() {
  S.phase = 'over'; setPhase('morning'); updateHUD(); setTip('🚁 구조 완료!');
  const rescued = S.flags.flare || chance(.75);
  const text = rescued
    ? `새벽빛 속에서 헬리콥터가 옥상 위로 내려앉았다.\n${S.comp ? `동료 ${S.comp}명과 함께 ` : ''}${S.dog ? '개를 품에 안고 ' : ''}사다리에 올랐다.\n\n아래로 보이는 우리 동네는 조용했다.\n<span class="g">30일을 버텨 냈다.</span>\n\n${summary()}`
    : `헬리콥터는 우리 동네를 지나쳐 갔다… 하지만 30일을 버틴 당신은 이제 무엇이든 할 수 있다.\n다음 구조대는 분명 찾아올 것이다.\n\n${summary()}`;
  card({ tag: rescued ? 'ENDING · 구조' : 'ENDING · 생존자', title: rescued ? '구조되었다' : '살아남았다', text, choices: [
    { t: '🔁 같은 동네에서 다시', fn: rebuildSameWorld },
    { t: '🗺 다른 동네 고르기', fn: backToMap }] });
}
function backToMap() {
  closeCard(); setRoadview(false);
  $('#game').classList.add('hidden'); $('#mapScreen').classList.remove('hidden');
  if (lmap) setTimeout(() => lmap.invalidateSize(), 50);
}

} else {
  initMap();
}

window.__NA = { get S() { return S; }, get WORLD() { return WORLD; }, worldFromOSM, worldProcedural, loadNeighborhood, onBuildingClick, walkTo, night,
  focus: (b, d, phi) => { setRoadview(false); focusOn(b.c[0], b.c[1], d); if (phi) orbit.phi = phi; } };
