<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1720">
<title>Breachpoint Mobile</title>
<style>
:root{--bg:#0f1720;--panel:rgba(12,18,26,.82);--ink:#eef3f8;--dim:#93a4b5;--ally:#3fb6ff;--enemy:#ff7a3d;--gold:#ffd166;--ok:#5ee6a8;--line:rgba(255,255,255,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1720}}
:root[data-theme="dark"]{--bg:#0f1720}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;overscroll-behavior:none}
canvas#view{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);padding:4px 12px;border-radius:10px;font-weight:700}
#top .s{font-size:20px;min-width:22px;text-align:center}
#top .ally{color:var(--ally)}#top .enemy{color:var(--enemy)}
#timer{font-size:18px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#timer.planted{color:var(--enemy)}
#phase{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 40px);left:50%;transform:translateX(-50%);font-size:12px;color:var(--dim);background:var(--panel);padding:2px 10px;border-radius:8px;white-space:nowrap}
#mini{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));background:var(--panel);border-radius:8px;border:1px solid var(--line)}
#feed{position:absolute;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));font-size:12px;text-align:right;display:flex;flex-direction:column;gap:3px}
#feed div{background:var(--panel);padding:2px 8px;border-radius:6px}
#vitals{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:flex-end;background:var(--panel);padding:4px 14px;border-radius:10px}
#vitals .big{font-size:24px;font-weight:800}#vitals .lab{font-size:10px;color:var(--dim)}
#hpv{color:#fff}#shv{color:#9fd4ff}#ammo .big{font-variant-numeric:tabular-nums}
#credits{color:var(--gold);font-weight:700;font-size:13px}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross::before,#cross::after{content:"";position:absolute;background:#7dffb2;box-shadow:0 0 2px #000}
#cross::before{left:10px;top:0;width:2px;height:22px;clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%)}
#cross::after{top:10px;left:0;height:2px;width:22px;clip-path:polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%)}
#hitm{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;border:2px dashed #fff;border-radius:3px;transition:opacity .15s}
#hitm.on{opacity:1;transition:none}#hitm.head{border-color:#ff5c5c}
#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-size:34px;letter-spacing:2px;text-shadow:0 2px 12px #000}
#banner small{display:block;font-size:14px;font-weight:600;color:var(--dim);letter-spacing:0;margin-top:4px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#smokeov{position:absolute;inset:0;background:#7f8a96;opacity:0}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(255,40,40,.75);opacity:0;transition:opacity .4s}
#progress{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:220px;background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;text-align:center}
#progress .bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:4px;overflow:hidden}
#progress .fill{height:100%;width:0;background:var(--gold)}
#spec{position:absolute;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 60px);left:50%;transform:translateX(-50%);font-size:13px;background:var(--panel);padding:3px 12px;border-radius:8px}
/* buttons */
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;color:#fff;background:rgba(20,28,38,.55);border:2px solid rgba(255,255,255,.35);font-size:14px;line-height:1}
.btn.on{background:rgba(255,255,255,.3)}
.btn small{font-size:9px;font-weight:600;color:var(--dim);margin-top:2px}
.btn.off{opacity:.35}
#bFire{width:84px;height:84px;right:calc(max(20px,env(safe-area-inset-right)) + 0px);bottom:110px;background:rgba(255,90,54,.35);border-color:rgba(255,140,110,.8);font-size:13px}
#bFire2{width:58px;height:58px;left:calc(max(14px,env(safe-area-inset-left)) + 6px);top:42%;background:rgba(255,90,54,.3);border-color:rgba(255,140,110,.6);font-size:11px}
#bAim{width:56px;height:56px;right:calc(max(20px,env(safe-area-inset-right)) + 98px);bottom:150px;font-size:12px}
#bReload{width:48px;height:48px;right:calc(max(20px,env(safe-area-inset-right)) + 112px);bottom:216px;font-size:12px}
#bQ{width:52px;height:52px;right:calc(max(20px,env(safe-area-inset-right)) + 108px);bottom:76px}
#bE{width:52px;height:52px;right:calc(max(20px,env(safe-area-inset-right)) + 168px);bottom:40px}
#bX{width:56px;height:56px;right:calc(max(20px,env(safe-area-inset-right)) + 96px);bottom:14px;border-color:var(--gold)}
#bX.ready{background:rgba(255,209,102,.4);box-shadow:0 0 12px var(--gold)}
#bAct{width:72px;height:72px;left:50%;bottom:90px;transform:translateX(-50%);border-radius:14px;background:rgba(255,209,102,.3);border-color:var(--gold);font-size:13px}
#bShop{width:64px;height:40px;border-radius:10px;right:calc(max(14px,env(safe-area-inset-right)) + 0px);top:calc(max(6px,env(safe-area-inset-top)) + 96px);background:rgba(255,209,102,.3);border-color:var(--gold);font-size:13px}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
/* overlays */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,12,18,.86);z-index:5;padding:16px;overflow:auto}
.card{margin:auto;background:#16202c;border:1px solid var(--line);border-radius:14px;padding:16px;max-width:760px;width:100%}
h1{margin:0 0 2px;font-size:30px;letter-spacing:3px}
h1 span{color:var(--enemy)}
.sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.agent{border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;pointer-events:auto}
.agent.sel{border-color:var(--ally);background:rgba(63,182,255,.12)}
.agent b{font-size:16px}.agent .role{font-size:11px;color:var(--dim)}
.agent ul{margin:6px 0 0;padding-left:16px;font-size:11px;color:#cfd8e2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.seg button{background:#0f1720;color:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-weight:700}
.seg button.sel{border-color:var(--ally);background:rgba(63,182,255,.15)}
.go{margin-top:12px;width:100%;padding:12px;font-size:18px;font-weight:900;letter-spacing:2px;border:0;border-radius:10px;background:var(--enemy);color:#fff}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px;background:#0f1720;color:var(--ink);text-align:left}
.item b{display:block}.item .p{color:var(--gold);font-weight:700;font-size:13px}.item .d{font-size:10px;color:var(--dim)}
.item.owned{border-color:var(--ok)}.item.cant{opacity:.4}
#rotate{z-index:9}
input[type=range]{width:140px}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <canvas id="mini" width="160" height="104"></canvas>
  <div id="top"><span class="s ally" id="sA">0</span><span id="timer">0:00</span><span class="s enemy" id="sE">0</span></div>
  <div id="phase"></div>
  <div id="feed"></div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="smokeov"></div><div id="dmg"></div><div id="flash"></div>
  <div id="banner"></div>
  <div id="progress" class="hidden"><span id="progT"></span><div class="bar"><div class="fill" id="progF"></div></div></div>
  <div id="spec" class="hidden"></div>
  <div id="vitals">
    <div><div class="big" id="hpv">100</div><div class="lab">체력</div></div>
    <div><div class="big" id="shv">0</div><div class="lab">실드</div></div>
    <div id="ammo"><div class="big"><span id="mag">12</span><span style="font-size:14px;color:var(--dim)"> / <span id="res">36</span></span></div><div class="lab" id="wname">P-9 핍</div></div>
    <div><div id="credits">¤ 800</div><div class="lab" id="sideLab">공격</div></div>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="bFire" data-b="fire">사격</div>
  <div class="btn" id="bFire2" data-b="fire">사격</div>
  <div class="btn" id="bAim" data-b="aim">조준</div>
  <div class="btn" id="bReload" data-b="reload">장전</div>
  <div class="btn" id="bQ" data-b="q"><span id="qN">Q</span><small id="qC">2</small></div>
  <div class="btn" id="bE" data-b="e"><span id="eN">E</span><small id="eC">2</small></div>
  <div class="btn" id="bX" data-b="x"><span id="xN">X</span><small id="xC">0/6</small></div>
  <div class="btn hidden" id="bAct" data-b="act">설치</div>
  <div class="btn hidden" id="bShop" data-b="shop">상점</div>
</div>

<div class="ov" id="menu">
  <div class="card">
    <h1>BREACH<span>POINT</span></h1>
    <div class="sub">모바일 전용 5:5 택티컬 히어로 슈터 · 코어를 설치하거나 막아라 · 5라운드 선승</div>
    <div style="font-size:13px;font-weight:700">요원 선택</div>
    <div class="agents" id="agents"></div>
    <div class="row">진영
      <span class="seg" id="sideSeg"><button data-v="0" class="sel">공격 먼저</button><button data-v="1">수비 먼저</button></span>
    </div>
    <div class="row">봇 난이도
      <span class="seg" id="diffSeg"><button data-v="0">쉬움</button><button data-v="1" class="sel">보통</button><button data-v="2">어려움</button></span>
    </div>
    <div class="row">시점 감도 <input type="range" id="sens" min="2" max="14" value="6"></div>
    <button class="go" id="start">경기 시작</button>
    <div class="sub" style="margin:10px 0 0;font-size:11px">왼쪽 화면 드래그: 이동 · 오른쪽 화면 드래그: 시점 · 사격 버튼을 누른 채 드래그하면 조준하며 연사 · 가로 모드 권장</div>
  </div>
</div>

<div class="ov hidden" id="shop">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">구매</b><span id="shopCred" style="color:var(--gold);font-weight:800"></span></div>
    <div class="sub" style="margin:2px 0 8px">구매 단계에서만 이용 가능 · 살아남으면 무기는 다음 라운드에도 유지됩니다</div>
    <div class="shopgrid" id="shopGrid"></div>
    <button class="go" id="shopClose" style="background:#2b3a4c;font-size:15px;padding:10px">닫기</button>
  </div>
</div>

<div class="ov hidden" id="over">
  <div class="card" style="text-align:center">
    <h1 id="overT">승리</h1>
    <div class="sub" id="overS"></div>
    <div id="board" style="font-size:13px;text-align:left"></div>
    <button class="go" id="again">메인 메뉴</button>
  </div>
</div>

<div class="ov hidden" id="rotate"><div style="text-align:center;font-size:18px;font-weight:700">📱↻<br>기기를 가로로 돌려주세요</div></div>

<script type="module">
import * as THREE from './three.module.min.js';

// ============================================================ DATA
const CELL = 3, WALL_H = 4.6, CRATE_H = 2.0, EYE = 1.6, RAD = 0.42;
const MAP = [
"########################################",
"#..........#####........#####..........#",
"#.AAAAAAA..#####.dddddd.#####..BBBBBBB.#",
"#.AAoAAAA........dddddd........BBBBoBB.#",
"#.AAAAAoA........dddddd........BoBBBBB.#",
"#.AAAAAAA..#####.dddddd.#####..BBBBBBB.#",
"#.AoAAAAA..#####........#####..BBBBBoB.#",
"#..........#####...##...#####..........#",
"####..##########........##########..####",
"####..##########..o.....##########..####",
"####..####..............o.....####..####",
"####..####..######..######....####..####",
"####......o.######..######..o.......####",
"####........######..######..........####",
"####..##########......##########..######",
"####..####......o.........######..######",
"####..####....###....###..######..######",
"####..........###....###..........######",
"####..........###....###......o...######",
"######..##########..##########..########",
"######..##########..##########..########",
"######.......................o..########",
"######..........aaaaaaaa........########",
"######..........aaaaaaaa........########",
"######..........aaaaaaaa........########",
"########################################"];
const GH = MAP.length, GW = MAP[0].length;
const cellAt = (r, c) => (r < 0 || c < 0 || r >= GH || c >= GW) ? '#' : MAP[r][c];
const solidRC = (r, c) => { const t = cellAt(r, c); return t === '#' || t === 'o'; };
const toRC = (x, z) => [Math.floor(z / CELL), Math.floor(x / CELL)];
const cx = c => c * CELL + CELL / 2, cz = r => r * CELL + CELL / 2;
const cellsOf = ch => { const o = []; for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) if (MAP[r][c] === ch) o.push([r, c]); return o; };
const SITE = { A: cellsOf('A'), B: cellsOf('B') };
const SPAWN = [cellsOf('a'), cellsOf('d')]; // side 0 = attack, 1 = defend
const MID = [[10, 18], [12, 19], [9, 21], [15, 20]];
const siteOf = (x, z) => { const [r, c] = toRC(x, z); const t = cellAt(r, c); return (t === 'A' || t === 'B') ? t : null; };

const WEAPONS = {
  pip:     { id:'pip', name:'P-9 핍', kind:'권총', cost:0, dmg:26, head:3.0, rate:6.5, mag:12, res:36, spread:.010, move:.035, bloom:.006, reload:1.5, falloff:.85, zoom:1.15 },
  hornet:  { id:'hornet', name:'호넷', kind:'기관단총', cost:950, dmg:24, head:2.5, rate:13, mag:30, res:90, spread:.022, move:.026, bloom:.004, reload:2.1, falloff:.75, zoom:1.15 },
  mauler:  { id:'mauler', name:'몰러', kind:'산탄총', cost:1700, dmg:11, head:2.0, rate:1.4, mag:6, res:18, spread:.075, move:.02, bloom:0, reload:2.4, falloff:.4, pellets:12, zoom:1.1 },
  kestrel: { id:'kestrel', name:'케스트렐', kind:'돌격소총', cost:2900, dmg:40, head:4.0, rate:9.5, mag:25, res:75, spread:.005, move:.06, bloom:.009, reload:2.3, falloff:.9, zoom:1.35 },
  heron:   { id:'heron', name:'헤론', kind:'저격총', cost:4500, dmg:150, head:1.7, rate:.65, mag:5, res:10, spread:.002, move:.14, bloom:.05, reload:3.4, falloff:1, zoom:3.0 },
};
const SHIELDS = [{ id:'s25', name:'경량 실드', cost:400, v:25 }, { id:'s50', name:'중장 실드', cost:1000, v:50 }];

const AGENTS = {
  veil: { name:'VEIL', role:'전략가 · 시야 차단', color:0x8b7bff,
    q:{ id:'flash', name:'섬광', n:2 }, e:{ id:'smoke', name:'연막', n:2 }, x:{ id:'blackout', name:'암전', cost:6 },
    desc:['Q 섬광: 앞으로 날아가 터지며 바라본 적을 실명','E 연막: 조준 지점에 시야 차단 연막','X 암전: 주변 30m 적 전원 실명 + 위치 노출'] },
  rift: { name:'RIFT', role:'타격대 · 진입', color:0xff9f43,
    q:{ id:'dash', name:'질주', n:2 }, e:{ id:'flash', name:'섬광', n:1 }, x:{ id:'overdrive', name:'과부하', cost:6 },
    desc:['Q 질주: 이동 방향으로 순간 돌진','E 섬광: 앞으로 날아가 터지는 섬광','X 과부하: 8초간 연사·정확도·이동속도 강화'] },
  root: { name:'ROOT', role:'감시자 · 정보/생존', color:0x2ed3a3,
    q:{ id:'heal', name:'치유', n:1 }, e:{ id:'recon', name:'정찰', n:2 }, x:{ id:'fortify', name:'요새', cost:6 },
    desc:['Q 치유: 3초간 체력 60 회복','E 정찰: 40m 내 적 위치를 벽 너머로 4초 노출','X 요새: 체력 완전 회복 + 실드 50 + 적 전원 노출'] },
};
const NAMES = [['나', 'KITE', 'JUNO', 'MOSS', 'PIKE'], ['VEX', 'ORIN', 'SABLE', 'TARN', 'QUILL']];
const DIFF = [ { react:.75, err:.06, head:.12, turn:4 }, { react:.48, err:.035, head:.28, turn:6.5 }, { react:.3, err:.02, head:.45, turn:9 } ];
const T_BUY = 12, T_LIVE = 95, T_PLANT = 40, T_END = 4.5, PLANT_TIME = 3.5, DEFUSE_TIME = 6, WIN_ROUNDS = 5, HALF = 4;

// ============================================================ RENDERER / SCENE
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc6e6);
scene.fog = new THREE.Fog(0x9cc6e6, 40, 110);
const camera = new THREE.PerspectiveCamera(78, 1, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x6b5a48, 1.15));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(30, 60, 20); scene.add(sun);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  document.getElementById('rotate').classList.toggle('hidden', innerWidth >= innerHeight || !matchMedia('(pointer:coarse)').matches);
}
addEventListener('resize', resize); resize();

function buildMap() {
  const floorTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    g.fillStyle = '#c9bca6'; g.fillRect(0, 0, 64, 64); g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 2; g.strokeRect(1, 1, 62, 62);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(GW, GH); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(GW * CELL, GH * CELL), new THREE.MeshLambertMaterial({ map: floorTex }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(GW * CELL / 2, 0, GH * CELL / 2); scene.add(floor);
  // site + spawn floor tints
  const tint = (cells, color) => { const m = new THREE.InstancedMesh(new THREE.PlaneGeometry(CELL, CELL), new THREE.MeshLambertMaterial({ color, transparent: true, opacity: .35 }), cells.length);
    const o = new THREE.Object3D(); cells.forEach(([r, c], i) => { o.position.set(cx(c), .01, cz(r)); o.rotation.x = -Math.PI / 2; o.updateMatrix(); m.setMatrixAt(i, o.matrix); }); scene.add(m); };
  tint(SITE.A, 0xffb347); tint(SITE.B, 0xffb347); tint(SPAWN[0], 0xff7a3d); tint(SPAWN[1], 0x3fb6ff);
  // walls (only those adjacent to open space) + crates

  $('xN').textContent = d.x.name; $('xC').textContent = `${p.ult}/${d.x.cost}`; $('bX').classList.toggle('ready', p.ult >= d.x.cost); $('bX').classList.toggle('off', p.ult < d.x.cost);
  $('bAim').classList.toggle('on', aiming);
  // context action
  let act = null;
  if (p.alive && G.phase === 'live' && G.carrier === p && siteOf(p.pos.x, p.pos.z)) act = '설치';
  if (p.alive && G.phase === 'planted' && sideOf(0) === 1 && G.core && Math.hypot(G.core.x - p.pos.x, G.core.z - p.pos.z) < 1.8) act = '해체';
  actBtn.textContent = act ? `${act}\n(길게)` : ''; actBtn.classList.toggle('hidden', !act);
  if (!act) actHeld = false;
  shopBtn.classList.toggle('hidden', G.phase !== 'buy' || !p.alive);
  const pr = G.planting || G.defusing;
  $('progress').classList.toggle('hidden', !pr || !(pr.who.team === 0));
  if (pr) { $('progT').textContent = `${pr.who.name} ${G.planting ? '코어 설치 중' : '코어 해체 중'}`; $('progF').style.width = (pr.t / (G.planting ? PLANT_TIME : DEFUSE_TIME) * 100) + '%'; }
  $('flash').style.opacity = Math.min(1, flashT / 1.2);
  let inSmoke = 0; for (const s of smokes) { const dd = Math.hypot(camera.position.x - s.x, camera.position.z - s.z); if (dd < s.r) inSmoke = Math.max(inSmoke, Math.min(.9, (s.r - dd) / 1.5) * Math.min(1, s.mesh.material.opacity / .9)); }
  $('smokeov').style.opacity = inSmoke;
  specEl.textContent = specTarget ? `관전 중: ${specTarget.name} — 사망했습니다` : '사망 — 팀 전멸';
}

// shop
function openShop() { if (G.phase !== 'buy' || !player.alive) return; $('shop').classList.remove('hidden'); renderShop(); firing = false; moveVec.set(0, 0); stickEl.style.display = 'none'; touches.clear(); }
function renderShop() {
  const p = player; $('shopCred').textContent = '¤ ' + p.credits; const grid = $('shopGrid'); grid.innerHTML = '';
  const add = (name, kind, cost, desc, owned, fn) => { const b = document.createElement('button'); b.className = 'item' + (owned ? ' owned' : '') + (!owned && cost > p.credits ? ' cant' : '');
    b.innerHTML = `<b>${name}</b><span class="d">${kind}</span><div class="p">${owned ? '보유 중' : '¤ ' + cost}</div><div class="d">${desc}</div>`; b.onclick = () => { if (!owned && cost <= p.credits) { fn(); renderShop(); tone(990, .08, .08); } }; grid.appendChild(b); };
  for (const w of Object.values(WEAPONS)) { if (w.id === 'pip') continue;
    add(w.name, w.kind, w.cost, `피해 ${w.dmg}${w.pellets ? '×' + w.pellets : ''} · 헤드 ×${w.head} · 탄창 ${w.mag}`, p.primary && p.primary.def.id === w.id, () => { if (p.primary) p.credits += p.primary.def.cost; p.credits -= w.cost; p.primary = p.makeGun(w.id); }); }
  for (const s of SHIELDS) add(s.name, '방어구', s.cost, `실드 ${s.v} (피해 66% 흡수)`, p.shield >= s.v, () => { p.credits -= s.cost; p.shield = s.v; });
}
$('shopClose').onclick = () => $('shop').classList.add('hidden');

// ============================================================ ROUND LOGIC
function endRound(winnerTeam, reason) {
  if (G.phase === 'end') return;
  G.phase = 'end'; G.timer = T_END; G.planting = G.defusing = null;
  G.score[winnerTeam]++;
  const loser = 1 - winnerTeam;
  G.lossStreak[winnerTeam] = 0; G.lossStreak[loser]++;
  for (const a of agents) { a.credits = Math.min(9000, a.credits + (a.team === winnerTeam ? 3000 : 1900 + 500 * Math.min(2, G.lossStreak[loser] - 1)));
    a.ult = Math.min(a.def.x.cost, a.ult + 1); }
  showBanner(winnerTeam === 0 ? '라운드 승리' : '라운드 패배', reason, T_END);
  bannerEl.style.color = winnerTeam === 0 ? '#5ee6a8' : '#ff7a3d';
  tone(winnerTeam === 0 ? 660 : 220, .5, .12, 'triangle');
}
function updateRound(dt) {
  G.timer -= dt;
  const alive = t => agents.some(a => a.alive && a.team === t);
  const atkTeam = G.playerSide === 0 ? 0 : 1, defTeam = 1 - atkTeam;
  if (G.phase === 'buy') { if (G.timer <= 0) { G.phase = 'live'; G.timer = T_LIVE; $('shop').classList.add('hidden'); tone(520, .2, .1); } return; }
  if (G.phase === 'end') {
    if (G.timer <= 0) {
      if (G.score[0] >= WIN_ROUNDS || G.score[1] >= WIN_ROUNDS || (G.round >= HALF * 2 && G.score[0] !== G.score[1]) || G.round >= HALF * 2 + 2) return gameOver();
      specEl.classList.add('hidden'); startRound();
    }
    return;
  }
  // pick up dropped core
  if (G.core && !G.core.planted) for (const a of agents) if (a.alive && sideOf(a.team) === 0 && Math.hypot(a.pos.x - G.core.x, a.pos.z - G.core.z) < 1.2) {
    G.carrier = a; G.core = null; coreMesh.visible = false; if (a.isPlayer) pushFeed('코어를 주웠습니다', '#ffd166'); break; }
  // planting
  if (G.planting) { const w = G.planting.who; G.planting.t += dt;
    if (!w.alive || !siteOf(w.pos.x, w.pos.z) || (w.isPlayer && !actHeld)) G.planting = null;
    else if (G.planting.t >= PLANT_TIME) {
      G.phase = 'planted'; G.timer = T_PLANT; G.plantSite = siteOf(w.pos.x, w.pos.z); G.core = { x: w.pos.x, z: w.pos.z, planted: true }; G.carrier = null; G.planting = null;
      coreMesh.position.set(w.pos.x, 0, w.pos.z); coreMesh.visible = true; w.credits += 300; w.ult = Math.min(w.def.x.cost, w.ult + 1);
      showBanner('코어 설치됨', `${G.plantSite} 지점 · ${T_PLANT}초 후 폭발`, 2); tone(880, .3, .15, 'square');
    } }
  if (G.defusing) { const w = G.defusing.who; G.defusing.t += dt;
    if (!w.alive || Math.hypot(G.core.x - w.pos.x, G.core.z - w.pos.z) > 2 || (w.isPlayer && !actHeld)) G.defusing = null;
    else if (G.defusing.t >= DEFUSE_TIME) return endRound(defTeam, '코어 해체 성공'); }
  if (actHeld && player.alive) {
    if (G.phase === 'live' && G.carrier === player && siteOf(player.pos.x, player.pos.z) && !G.planting) G.planting = { who: player, t: 0 };
    if (G.phase === 'planted' && sideOf(0) === 1 && !G.defusing && Math.hypot(G.core.x - player.pos.x, G.core.z - player.pos.z) < 1.8) G.defusing = { who: player, t: 0 };
  }
  // win conditions
  if (G.phase === 'live') {
    if (!alive(atkTeam)) return endRound(defTeam, '공격팀 전멸');
    if (!alive(defTeam)) return endRound(atkTeam, '수비팀 전멸');
    if (G.timer <= 0) return endRound(defTeam, '시간 초과');
  } else if (G.phase === 'planted') {
    if (!alive(defTeam)) return endRound(atkTeam, '수비팀 전멸');
    const beep = Math.max(.12, G.timer / T_PLANT); G.beepT = (G.beepT || 0) - dt;
    if (G.beepT <= 0) { G.beepT = beep; const d = player ? Math.hypot(player.pos.x - G.core.x, player.pos.z - G.core.z) : 0; tone(1400, .06, .1 * Math.max(.15, 1 - d / 60)); coreMesh.userData.light.visible = true; setTimeout(() => coreMesh.userData.light.visible = false, 60); }
    if (G.timer <= 0) {
      for (const a of agents) if (a.alive && Math.hypot(a.pos.x - G.core.x, a.pos.z - G.core.z) < 12) { a.hp = 0; a.alive = false; a.mesh.rotation.z = Math.PI / 2; a.mesh.position.y = .35; a.mesh.visible = true; }
      flashT = Math.max(flashT, player && Math.hypot(player.pos.x - G.core.x, player.pos.z - G.core.z) < 40 ? 1.2 : 0); noiseBurst(.8, 1.2, 120, .4);
      return endRound(atkTeam, '코어 폭발');
    }
  }
}
function gameOver() {
  G.state = 'over'; document.exitPointerLock?.();
  const win = G.score[0] > G.score[1];
  $('overT').textContent = win ? '승리' : G.score[0] === G.score[1] ? '무승부' : '패배'; $('overT').style.color = win ? '#5ee6a8' : '#ff7a3d';
  $('overS').textContent = `최종 스코어 ${G.score[0]} : ${G.score[1]}`;
  const row = a => `<tr><td style="color:${a.team ? '#ff7a3d' : '#3fb6ff'}">${a.name}</td><td>${a.def.name}</td><td>${a.kills}</td><td>${a.deaths}</td></tr>`;
  $('board').innerHTML = `<table style="width:100%;border-collapse:collapse"><tr style="color:#93a4b5"><td>플레이어</td><td>요원</td><td>K</td><td>D</td></tr>${[...agents].sort((p, q) => q.kills - p.kills).map(row).join('')}</table>`;
  $('over').classList.remove('hidden'); hudEl.classList.add('hidden');
}

// ============================================================ VIEWMODEL
const vm = new THREE.Group(); camera.add(vm);
const vmGun = new THREE.Mesh(new THREE.BoxGeometry(.09, .11, .55), new THREE.MeshLambertMaterial({ color: 0x2a313b })); vmGun.position.set(.2, -.2, -.45); vm.add(vmGun);
const vmBarrel = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, .3), new THREE.MeshLambertMaterial({ color: 0x15191f })); vmBarrel.position.set(.2, -.18, -.8); vm.add(vmBarrel);
const vmMuzzle = new THREE.Mesh(new THREE.SphereGeometry(.07, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffe28a })); vmMuzzle.position.set(.2, -.18, -.98); vmMuzzle.visible = false; vm.add(vmMuzzle);
const vmHand = new THREE.Mesh(new THREE.BoxGeometry(.12, .1, .14), new THREE.MeshLambertMaterial({ color: 0xc89b74 })); vmHand.position.set(.2, -.27, -.32); vm.add(vmHand);

// ============================================================ MAIN LOOP
let specTarget = null, last = performance.now(), bob = 0;
const TS = +(new URLSearchParams(location.search).get('ts') || 1); // test-only time scale
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.state === 'play') for (let i = 0; i < TS; i++) step(dt);
  renderer.render(scene, camera);
}
function step(dt) {
  const p = player;
  // player movement
  for (const a of agents) { a.cool = Math.max(0, a.cool - dt); a.bloom = Math.max(0, a.bloom - dt * .09);
    const g = a.gun; if (g.reloadT > 0) { g.reloadT -= dt; if (g.reloadT <= 0) { const need = g.def.mag - g.mag, take = Math.min(need, g.res); g.mag += take; g.res -= take; } }
    if (a.healT > 0 && a.alive) { a.healT -= dt; a.hp = Math.min(100, a.hp + 20 * dt); }
    a.overT = Math.max(0, a.overT - dt); a.revealT = Math.max(0, a.revealT - dt); }
  if (p.alive) {
    const mv = moveVec.clone();
    if (keys.KeyW) mv.y += 1; if (keys.KeyS) mv.y -= 1; if (keys.KeyA) mv.x -= 1; if (keys.KeyD) mv.x += 1;
    if (keys.ArrowLeft) p.yaw += 2.2 * dt; if (keys.ArrowRight) p.yaw -= 2.2 * dt;
    if (mv.length() > 1) mv.normalize();
    const busy = (G.planting && G.planting.who === p) || (G.defusing && G.defusing.who === p);
    const speed = (aiming ? 3.2 : 5.4) * (p.overT > 0 ? 1.15 : 1) * (p.gun.def.id === 'heron' ? .9 : 1);
    moveAgent(p, busy ? new THREE.Vector3() : worldMove(p, mv), speed, dt);
    if ((firing || keys.Space) && G.phase !== 'buy' && G.phase !== 'end') fire(p);
    p.blindT = Math.max(0, p.blindT - dt);
  }
  for (const a of agents) if (!a.isPlayer && a.alive) botThink(a, dt);
  updateProjectiles(dt); updateFx(dt);
  updateRound(dt);
  if (G.state !== 'play') return;
  // meshes
  for (const a of agents) {
    if (a.alive) { a.mesh.position.set(a.pos.x, 0, a.pos.z); a.mesh.rotation.y = a.yaw; }
    a.marker.visible = a.alive && a.team === 1 && a.revealT > 0;
  }
  // camera
  recoilKick *= Math.pow(.0005, dt); gunKick *= Math.pow(.0002, dt); flashT = Math.max(0, flashT - dt);
  let view = p;
  if (!p.alive) { if (!specTarget || !specTarget.alive) specTarget = agents.find(a => a.alive && a.team === 0) || null; view = specTarget || p; } else specTarget = null;
  for (const a of agents) if (!a.isPlayer) a.mesh.visible = !(a === specTarget && a.alive);
  const spd = Math.hypot(view.vel.x, view.vel.z); bob += spd * dt * 2.2;
  camera.position.set(view.pos.x, view.alive ? EYE + Math.sin(bob) * .03 * Math.min(1, spd / 5) : 3.5, view.pos.z);
  camera.rotation.set(view.pitch + (view === p ? recoilKick : 0), view.yaw, 0);
  const fov = p.alive && aiming ? 78 / p.gun.def.zoom : 78; if (Math.abs(camera.fov - fov) > .1) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 14); camera.updateProjectionMatrix(); }
  vm.visible = p.alive && !(aiming && p.gun.def.id === 'heron');
  vm.position.set(Math.sin(bob * .5) * .012, Math.abs(Math.cos(bob * .5)) * -.012 - (p.gun.reloadT > 0 ? .15 : 0), gunKick * .06);
  vm.rotation.x = gunKick * .12; vmMuzzle.visible = gunKick > .6;
  vmGun.scale.z = { pip: .6, hornet: .85, mauler: 1.1, kestrel: 1.2, heron: 1.5 }[p.gun.def.id];
  // HUD
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) bannerEl.style.opacity = 0; }
  drawMini(); updateHud();
}
requestAnimationFrame(tick);

// ============================================================ MENU
let chosen = 'veil';
const agWrap = $('agents');
for (const [k, d] of Object.entries(AGENTS)) {
  const el = document.createElement('div'); el.className = 'agent' + (k === chosen ? ' sel' : ''); el.dataset.k = k;
  el.innerHTML = `<b style="color:#${d.color.toString(16).padStart(6, '0')}">${d.name}</b><div class="role">${d.role}</div><ul>${d.desc.map(x => `<li>${x}</li>`).join('')}</ul>`;
  el.onclick = () => { chosen = k; agWrap.querySelectorAll('.agent').forEach(n => n.classList.toggle('sel', n.dataset.k === k)); };
  agWrap.appendChild(el);
}
const seg = id => { const w = $(id); w.querySelectorAll('button').forEach(b => b.onclick = () => { w.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }); return () => +w.querySelector('.sel').dataset.v; };
const getSide = seg('sideSeg'), getDiff = seg('diffSeg');
$('start').onclick = async () => {
  audio(); G.sens = +$('sens').value;
  try { if (matchMedia('(pointer:coarse)').matches) { await document.documentElement.requestFullscreen?.(); await screen.orientation?.lock?.('landscape'); } } catch (e) {}
  $('menu').classList.add('hidden'); hudEl.classList.remove('hidden');
  startMatch(chosen, getSide(), getDiff());
};
$('again').onclick = () => { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); G.state = 'menu'; };
window.__G = G; window.__agents = agents; // debug hooks for automated checks
</script>
