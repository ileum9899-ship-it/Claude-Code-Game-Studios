; Android-only overrides. Lumen, virtual shadow maps, volumetric clouds and volumetric fog
; are desktop features; the game disables the latter two itself on the mobile renderer
; (ALifeEnvironment::BeginPlay) and spawns fewer citizens and cars (Project Settings > Life RP > Mobile).

[SystemSettings]
; Render at ~85% of native resolution and upscale: most phones are 1080p+ at small sizes.
r.MobileContentScaleFactor=0
r.ScreenPercentage=85
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxMobileCascades=2
r.ViewDistanceScale=0.8
