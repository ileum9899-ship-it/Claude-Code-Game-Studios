[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
; Android: the engine's virtual joysticks (left = move / steer, right = look) drive the
; same Gamepad_Left2D / Gamepad_Right2D / Gamepad_LeftX mappings as a controller.
; Buttons (interact, run, jump, drive) are drawn by ALifeHUD as touch hit boxes.
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks
bAlwaysShowTouchInterface=False
; Lets the mouse act as a finger in the editor (Mobile Preview / PIE) to test touch controls.
bUseMouseForTouch=False
