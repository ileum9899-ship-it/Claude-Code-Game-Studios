[/Script/EngineSettings.GameMapsSettings]
; /Engine/Maps/Entry is an empty engine map: the game mode builds the whole town,
; sky and lighting at runtime, so the game runs with no level asset at all.
; Replace with your own (empty) level once you start dressing the world by hand.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/LifeRP.LifeGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic lighting (Lumen). No baked lightmaps, no "lighting needs rebuild".
r.AllowStaticLighting=False
; --- High-end UE5 rendering stack ---
; Lumen global illumination + reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
; Virtual shadow maps
r.Shadow.Virtual.Enable=1
; Temporal Super Resolution
r.AntiAliasingMethod=4
; Nanite
r.Nanite.ProjectEnabled=True
; Sky atmosphere drives height fog colour
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; Extended auto-exposure range so nights read as night, not grey
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
; MegaLights (production-ready in 5.8). It requires hardware ray tracing;
; set both to 1 on RT-capable GPUs for many shadowed street lights.
r.MegaLights.EnableForProject=0
r.RayTracing=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

